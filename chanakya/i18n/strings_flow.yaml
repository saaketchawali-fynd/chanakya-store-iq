# The sales flow (opener → why now → 4 home questions → photo → range → read-back → doubts → options → demo →
# reaction → complete → pay → offer → close → Rishta). Loaded last: overrides older keys with the same name.
# Associate-facing hi = Roman Hinglish; customer-facing lines (bolo_*) hi/mr = Devanagari. Buttons (b_*) ≤ 20 chars,
# list titles (row_*, cat_*) ≤ 24, list descriptions (*_d) ≤ 72.

# ---------- first contact / language ----------
