# ---------- room photo (per category) ----------
bolo_photo_ask_tv: {hi: "क्या आपके फ़ोन में उस कमरे की फ़ोटो है? मैं आपकी दीवार पर टीवी असली साइज़ में दिखा दूँगा।", mr: "तुमच्या फोनमध्ये त्या खोलीचा फोटो आहे का? मी तुमच्या भिंतीवर टीव्ही खऱ्या साइजमध्ये दाखवतो.", en: "Do you have a photo of that room on your phone? I'll show the TV on your wall at true size."}
bolo_photo_ask_ac: {hi: "क्या आपके फ़ोन में उस कमरे की फ़ोटो है? मैं दीवार पर AC असली साइज़ में दिखा दूँगा।", mr: "तुमच्या फोनमध्ये त्या खोलीचा फोटो आहे का? मी भिंतीवर AC खऱ्या साइजमध्ये दाखवतो.", en: "Do you have a photo of that room on your phone? I'll show the AC on your wall at true size."}
bolo_photo_ask_wm: {hi: "क्या आपके फ़ोन में उस जगह की फ़ोटो है? मैं वहाँ मशीन असली साइज़ में दिखा दूँगा।", mr: "तुमच्या फोनमध्ये त्या जागेचा फोटो आहे का? मी तिथे मशीन खऱ्या साइजमध्ये दाखवतो.", en: "Do you have a photo of that spot on your phone? I'll show the machine there at true size."}
bolo_photo_ask_fridge: {hi: "क्या आपके फ़ोन में किचन की फ़ोटो है? मैं वहाँ फ्रिज असली साइज़ में दिखा दूँगा।", mr: "तुमच्या फोनमध्ये किचनचा फोटो आहे का? मी तिथे फ्रिज खऱ्या साइजमध्ये दाखवतो.", en: "Do you have a photo of the kitchen on your phone? I'll show the fridge there at true size."}
kyun_photo_ask: {hi: "Apne ghar mein sahi size dekh kar faisla aasaan hota hai", mr: "स्वतःच्या घरात योग्य आकार पाहून निर्णय सोपा होतो", en: "Seeing the true size in their own home makes the decision easy"}

# ---------- comfort range ----------
