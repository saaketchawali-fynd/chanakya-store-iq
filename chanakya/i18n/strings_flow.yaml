# ---- Karo (user, 5 Nov 2026: "engaged customer presence"): what to do WITH the customer at each moment, one line
# under the Kyun. A key with _1/_2/_3 variants rotates (coach.do_block), so the same line never comes twice in a row.
label_do: {hi: "*Karo*", mr: "*करा*", en: "*Do*"}
do_opener:
  hi: "Muskura kar swagat kijiye; phone nahi, customer ki taraf dekhiye. Unhe bolne dijiye, phir neeche product chuniye."
  mr: "हसून स्वागत करा; फोनकडे नाही, ग्राहकाकडे बघा. त्यांना बोलू द्या, मग खाली प्रॉडक्ट निवडा."
  en: "Greet them with a smile and look at them, not the phone. Let them say what they need, then pick it below."
do_question_1:
  hi: "Phone nahi, unki taraf dekhkar poochiye. Unhe poora bolne dijiye, phir jawab tap kijiye ya voice note bhejiye."
  mr: "फोनकडे नाही, त्यांच्याकडे बघून विचारा. त्यांना पूर्ण बोलू द्या, मग उत्तर टॅप करा किंवा व्हॉइस नोट पाठवा."
  en: "Ask it looking at them, not the phone. Let them finish, then tap their answer or send their words as a voice note."
do_question_2:
  hi: "Unhe apne shabdon mein jawab dene dijiye; jo chhoti baatein woh jodte hain, wahi sahi fit batati hain."
  mr: "त्यांना त्यांच्या शब्दांत उत्तर देऊ द्या; ते जे छोटे तपशील सांगतात, तेच योग्य फिट सांगतात."
  en: "Let them answer in their own words; the small details they add tell you more than any button."
do_question_3:
  hi: "Sir hilakar unka jawab ek-do shabdon mein dohraiye, taaki unhe lage aapne suna; phir aage badhiye."
  mr: "मान डोलवा आणि त्यांचं उत्तर एक-दोन शब्दांत परत सांगा, म्हणजे कळेल की तुम्ही ऐकलं; मग पुढे चला."
  en: "Nod and repeat their answer in a word or two, so they know you heard it; then move on."
do_setup_1:
  hi: "Bataiye kyun pooch rahe hain: taaki kharcha aur setup pehli baar mein sahi ho."
  mr: "का विचारताय ते सांगा: म्हणजे खर्च आणि सेटअप पहिल्यांदाच बरोबर होईल."
  en: "Tell them why you ask: so the cost and the setup are right the first time."
do_setup_2:
  hi: "Baat chhoti aur dostana rakhiye; bas aakhri kuch baatein bachi hain."
  mr: "बोलणं छोटं आणि मैत्रीपूर्ण ठेवा; फक्त शेवटचे काही तपशील राहिलेत."
  en: "Keep it quick and friendly; these are the last few details."
do_data_question:
  hi: "Agar woh confuse lagein, to fark samjhane ki offer kijiye; zyada-tar customer khush hote hain ki aapne poocha."
  mr: "ते गोंधळलेले वाटले तर फरक समजावून सांगायची ऑफर द्या; बहुतेक ग्राहकांना तुम्ही विचारलं याचा आनंद होतो."
  en: "If they look unsure, offer to explain the difference; most customers are glad you asked."
do_explain:
  hi: "Apne shabdon mein aaram se samjhaiye, phir poochiye unke ghar ke liye kaunsa sahi lagta hai."
  mr: "तुमच्या शब्दांत सावकाश समजावून सांगा, मग विचारा त्यांच्या घरासाठी कोणतं योग्य वाटतं."
  en: "Explain it slowly, in your own words, then ask which sounds right for their home."
do_photo_ask:
  hi: "Unse phone mein photo kholne ko kahiye; jab tak woh dhoondhein, kamre ke baare mein baat karte rahiye."
  mr: "त्यांना फोनमध्ये फोटो उघडायला सांगा; ते शोधेपर्यंत खोलीबद्दल गप्पा सुरू ठेवा."
  en: "Ask them to open the photo on their phone; while they look for it, keep chatting about the room."
do_range:
  hi: "Halke se poochiye, sirf sahi models dikhane ke liye; number ke liye zor mat dijiye."
  mr: "हलकेच विचारा, फक्त योग्य मॉडेल दाखवण्यासाठी; आकड्यासाठी आग्रह करू नका."
  en: "Ask it lightly, only to show the right ones; never push for a number."
do_readback:
  hi: "Phone unki taraf ghumaiye aur aaram se padhkar sunaiye; kuch galat ho to unhe sudharne dijiye."
  mr: "फोन त्यांच्याकडे वळवा आणि सावकाश वाचून दाखवा; काही चुकलं असेल तर त्यांना दुरुस्त करू द्या."
  en: "Turn your phone to them and read it back slowly; let them correct anything."
do_doubts:
  hi: "Khulkar poochiye aur rukiye; jo shanka abhi bolein woh aasaani se door hoti hai, jo mann mein rahe woh sale rokti hai."
  mr: "मोकळेपणाने विचारा आणि थांबा; आत्ता सांगितलेली शंका सहज दूर होते, मनात राहिलेली विक्री थांबवते."
  en: "Ask openly and wait; a worry they say now is easy to clear, one they keep quiet blocks the sale."
do_options_ready:
  hi: "Bataiye ki ab unke ghar ke hisaab se options dikhayenge; unhe paas rakhiye taaki screen dikhe."
  mr: "सांगा की आता त्यांच्या घराला बसणारे पर्याय दाखवणार; त्यांना जवळ ठेवा म्हणजे स्क्रीन दिसेल."
  en: "Tell them you'll now show the ones that fit their home; keep them beside you, so they see the screen."
do_myth:
  hi: "Pehle sir hilakar sahmati dijiye; bahas kabhi nahi. Phir samjhaiye, ho sake to screen par dikhaiye."
  mr: "आधी मान डोलवून सहमती द्या; वाद कधीच नाही. मग समजावा, जमलं तर स्क्रीनवर दाखवा."
  en: "Nod and agree first; never argue. Then explain, and show it on the screen if you can."
do_price_rescue:
  hi: "Muskuraiye aur baat saral rakhiye; daam zaroor aayega, pehle fit dekh lein."
  mr: "हसा आणि सोपं ठेवा; किंमत नक्की येईल, आधी फिट बघू द्या."
  en: "Smile and keep it simple; the price is coming, once they see what fits."
do_benefit_1:
  hi: "Kehte waqt product ki taraf ishara kijiye; unhe sirf sunne nahi, dekhne dijiye."
  mr: "सांगताना प्रॉडक्टकडे बोट दाखवा; त्यांना फक्त ऐकू नाही, बघू द्या."
  en: "Point at the product as you say it; let them see it, not just hear it."
do_benefit_2:
  hi: "Kahiye, phir sawaal poochiye aur agle fayde se pehle unka jawab suniye."
  mr: "सांगा, मग प्रश्न विचारा आणि पुढच्या फायद्याआधी त्यांचं उत्तर ऐका."
  en: "Say it, ask the question, and hear their answer before the next benefit."
do_ignore:
  hi: "Dost ki salah ki tarah kahiye; jo bataye kis cheez ke liye zyada na dein, us par bharosa hota hai."
  mr: "मित्राचा सल्ला म्हणून सांगा; कशासाठी जास्त पैसे देऊ नका हे सांगणाऱ्यावर विश्वास बसतो."
  en: "Say it as friendly advice; customers trust the one who tells them what not to pay extra for."
do_tryon:
  hi: "Phone unki taraf ghumaiye, unke haath mein dijiye; poochiye jahan baithenge wahan se kaisa lagta hai."
  mr: "फोन त्यांच्याकडे वळवा, हातात द्या; विचारा जिथे बसणार तिथून कसं दिसतं."
  en: "Turn the phone to them and let them hold it; ask how it looks from where they'll sit."
do_view:
  hi: "Card unki taraf kijiye; kehte waqt unhe apna sofa yaad karne dijiye."
  mr: "कार्ड त्यांच्याकडे करा; सांगताना त्यांना त्यांचा सोफा आठवू द्या."
  en: "Turn the card to them; let them picture their own sofa while you say it."
do_demo:
  hi: "Unhe khud haath lagakar try karne dijiye; product nahi, unka chehra dekhiye."
  mr: "त्यांना स्वतः हात लावून बघू द्या; प्रॉडक्ट नाही, त्यांचा चेहरा बघा."
  en: "Let them try it with their own hands; watch their face, not the product."
do_prefer:
  hi: "Poochiye aur rukiye; khamoshi mat bhariye. Unke pehle shabd hi unki pasand batate hain."
  mr: "विचारा आणि थांबा; शांतता भरू नका. त्यांचे पहिले शब्दच त्यांची पसंती सांगतात."
  en: "Ask, then wait; don't fill the silence. Their first words tell you their pick."
do_missing:
  hi: "Options ka bachav kiye bina poochiye; jo kami unhe lagi, wahi batati hai aage kya dikhana hai."
  mr: "पर्यायांचा बचाव न करता विचारा; त्यांना जी कमी वाटली, तीच सांगते पुढे काय दाखवायचं."
  en: "Ask without defending the options; what they miss tells you exactly what to show next."
do_offer_line:
  hi: "Ek baar, achhi khabar ki tarah bataiye; phir wapas unki zaroorat par aaiye."
  mr: "एकदा, चांगली बातमी म्हणून सांगा; मग परत त्यांच्या गरजेकडे या."
  en: "Mention it once, as good news; then go back to what fits them."
do_made_for:
  hi: "Garmjoshi se badhai dijiye aur card dikhaiye; unki zaroorat poori hui, isliye unhone chuna."
  mr: "मनापासून अभिनंदन करा आणि कार्ड दाखवा; त्यांची गरज पूर्ण झाली, म्हणून त्यांनी निवडलं."
  en: "Congratulate them warmly and show them the card; their need, met, is why they chose it."
do_kharcha:
  hi: "Card dikhaiye aur total ek baar aaram se padhiye; poochiye kuch samajh na aaya ho to."
  mr: "कार्ड दाखवा आणि एकूण रक्कम एकदा सावकाश वाचा; काही अस्पष्ट वाटलं तर विचारा."
  en: "Show them the card and read the total once, slowly; ask if anything looks unclear."
do_pay:
  hi: "Seedhe poochiye, andaza mat lagaiye; jawab se sirf yeh tay hota hai ki kaunse offer lagenge."
  mr: "सरळ विचारा, अंदाज लावू नका; उत्तरावरून फक्त कोणत्या ऑफर लागू होतात ते ठरतं."
  en: "Ask it plainly, without guessing; the answer only decides which offers apply."
do_offer:
  hi: "Card dikhaiye aur amount ek baar aaram se padhiye. Phir rukiye, unhe sochne dijiye."
  mr: "कार्ड दाखवा आणि रक्कम एकदा सावकाश वाचा. मग थांबा, त्यांना विचार करू द्या."
  en: "Show them the card and read the amount once, slowly. Then stop and let them think."
do_close_choice:
  hi: "Poochiye, phir chup rahiye; din unhe chunne dijiye."
  mr: "विचारा, मग शांत राहा; दिवस त्यांना निवडू द्या."
  en: "Ask, then stay quiet; let them pick the day."
do_consent:
  hi: "Pyaar se, bina dabaav poochiye. Haan kahein to QR wala button dabaiye aur unhe aapke phone se scan karne dijiye."
  mr: "प्रेमाने, दबाव न आणता विचारा. हो म्हणाले तर QR चं बटण दाबा आणि त्यांना तुमच्या फोनवरून स्कॅन करू द्या."
  en: "Ask warmly, without pressure. If they say yes, tap the QR button and let them scan it from your phone."
do_nottoday:
  hi: "Mahaul halka rakhiye aur unke samay ke liye dhanyavaad kahiye; asli wajah suniye, phir neeche chuniye."
  mr: "वातावरण हलकं ठेवा आणि त्यांच्या वेळेबद्दल धन्यवाद द्या; खरं कारण ऐका, मग खाली निवडा."
  en: "Keep it light and thank them for their time; listen for the real reason, then pick it below."
do_objection:
  hi: "Shaanti se, unki taraf dekhkar kahiye; phir poochiye woh kya sochte hain, aur suniye."
  mr: "शांतपणे, त्यांच्याकडे बघून सांगा; मग विचारा त्यांना काय वाटतं, आणि ऐका."
  en: "Say it calmly, looking at them; then ask what they think, and listen."
do_no_discount:
  hi: "Narmi se kahiye aur seedhe offers par aaiye; jo system mein nahi, uska vaada mat kijiye."
  mr: "नम्रपणे सांगा आणि थेट ऑफर्सकडे या; सिस्टममध्ये नाही त्याचं वचन देऊ नका."
  en: "Say it kindly and go straight to the offers; never promise what isn't in the system."
do_expert_hold:
  hi: "Imaandari se bataiye ki expert se pooch rahe hain; tab tak agli cheez dikhaiye, taaki woh khaali na baithein."
  mr: "प्रामाणिकपणे सांगा की एक्सपर्टला विचारताय; तोपर्यंत पुढचं काही दाखवा, म्हणजे ते रिकामे थांबणार नाहीत."
  en: "Tell them honestly you're checking with an expert; show them the next thing meanwhile, so they don't wait idle."
