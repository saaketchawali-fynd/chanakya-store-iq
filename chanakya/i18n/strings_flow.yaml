# ---------- read it back ----------
bolo_readback: {hi: "Toh aapke ghar ke liye: {facts}. Sahi samjha?", mr: "तर तुमच्या घरासाठी: {facts}. बरोबर समजलो का?", en: "So, for your home: {facts}. Did I get that right?"}
