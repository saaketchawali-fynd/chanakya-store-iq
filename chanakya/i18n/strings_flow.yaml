bolo_photo_ask_ac: {hi: "Kya aapke phone mein us kamre ki photo hai? Main deewar par AC asli size mein dikha dunga.", mr: "तुमच्या फोनमध्ये त्या खोलीचा फोटो आहे का? मी भिंतीवर AC खऱ्या साइजमध्ये दाखवतो.", en: "Do you have a photo of that room on your phone? I'll show the AC on your wall at true size."}
bolo_photo_ask_wm: {hi: "Kya aapke phone mein us jagah ki photo hai? Main wahan machine asli size mein dikha dunga.", mr: "तुमच्या फोनमध्ये त्या जागेचा फोटो आहे का? मी तिथे मशीन खऱ्या साइजमध्ये दाखवतो.", en: "Do you have a photo of that spot on your phone? I'll show the machine there at true size."}
bolo_photo_ask_fridge: {hi: "Kya aapke phone mein kitchen ki photo hai? Main wahan fridge asli size mein dikha dunga.", mr: "तुमच्या फोनमध्ये किचनचा फोटो आहे का? मी तिथे फ्रिज खऱ्या साइजमध्ये दाखवतो.", en: "Do you have a photo of the kitchen on your phone? I'll show the fridge there at true size."}
kyun_photo_ask: {hi: "Apne ghar mein sahi size dekh kar faisla aasaan hota hai", mr: "स्वतःच्या घरात योग्य आकार पाहून निर्णय सोपा होतो", en: "Seeing the true size in their own home makes the decision easy"}

# ---------- comfort range ----------
bolo_range: {hi: "Taaki main sahi wale dikhaun — aapne lagbhag kitne tak ka socha hai?", mr: "म्हणजे मी योग्य दाखवेन — साधारण किती पर्यंतचा विचार केलाय?", en: "So I show you the right ones: roughly what range did you have in mind?"}
