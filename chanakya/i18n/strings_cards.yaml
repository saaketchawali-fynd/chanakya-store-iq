# ---- Ask an expert: the expert's queue, the question with its product facts, the clean answer (user, 5 Nov 2026)
expert_home_none:
  hi: "*Abhi koi sawaal intezaar mein nahi.*\n\nJab koi associate aisi baat poochega jo data mein nahi hai, woh pehle yahan aayegi. Jawab text ya voice note mein."
  mr: "*सध्या कोणताही प्रश्न वाट पाहत नाही.*\n\nअसोसिएटने डेटामध्ये नसलेली गोष्ट विचारली की ती आधी इथे येईल. उत्तर टेक्स्ट किंवा व्हॉइस नोटमध्ये."
  en: "*No questions waiting.*\n\nWhen an associate asks something the data doesn't cover, it comes here first. Answer by text or voice note."
expert_home_some:
  hi: "*Intezaar mein sawaal: {n}*\n\nEk chuniye aur text ya voice note mein jawab dijiye; seedha associate tak jayega."
  mr: "*वाट पाहणारे प्रश्न: {n}*\n\nएक निवडा आणि टेक्स्ट किंवा व्हॉइस नोटमध्ये उत्तर द्या; थेट असोसिएटकडे जाईल."
  en: "*Questions waiting: {n}*\n\nPick one and answer by text or voice note; it goes straight to the associate."
expert_home_lib: {hi: "• Library mein jawab: {n}. Wahi sawaal agli baar turant answer hota hai.", mr: "• लायब्ररीतील उत्तरं: {n}. तोच प्रश्न पुढच्या वेळी लगेच सुटतो.", en: "• Answers in the library: {n}. The same question is answered instantly next time."}
