# ---- the store visit log (user, 5 Nov 2026): home, the rubric questions, the scorecard and visits so far
visit_home:
  hi: "*Store visit log*\n\nCustomer ban kar store gaye? Voice note mein bataiye kaisa raha. Main use saat steps par, 14 mein se, score karunga, bilkul store visits ki tarah.\n\n_Naam kabhi save nahi hote._"
  mr: "*स्टोअर भेट लॉग*\n\nग्राहक म्हणून स्टोअरला गेलात? व्हॉइस नोटमध्ये सांगा कसं झालं. मी त्याला सात पायऱ्यांवर, 14 पैकी, स्कोअर करेन, अगदी स्टोअर भेटींसारखं.\n\n_नावं कधीच सेव्ह होत नाहीत._"
  en: "*Store visit log*\n\nVisited a store as a customer? Tell me how it went in a voice note. I'll score it on the seven steps, out of 14, just like the store visits.\n\n_Names are never saved._"
visit_home_count: {hi: "• Ab tak visits: {n} · median {m}/14", mr: "• आत्तापर्यंत भेटी: {n} · मीडियन {m}/14", en: "• Visits logged: {n} · median {m}/14"}
visit_more:
  hi: "*Aur jodiye*\n\nJo yaad aaye, ek aur voice note mein bhejiye: features ke baare mein kya kaha, poora kharcha, offer ya follow-up."
  mr: "*आणखी जोडा*\n\nजे आठवेल ते आणखी एका व्हॉइस नोटमध्ये पाठवा: फीचर्सबद्दल काय सांगितलं, पूर्ण खर्च, ऑफर किंवा फॉलो-अप."
  en: "*Add more*\n\nSend another voice note with anything you remember: what they said about the features, the full cost, the offer or the follow-up."
visit_export_one: {hi: "*Visit log:* 1 visit (CSV)", mr: "*भेट लॉग:* 1 भेट (CSV)", en: "*Visit log:* 1 visit (CSV)"}
b_visit_continue: {hi: "Visit jaari rakhein", mr: "भेट सुरू ठेवा", en: "Continue visit"}
b_visits_sofar: {hi: "Ab tak ki visits", mr: "आत्तापर्यंत भेटी", en: "Visits so far"}
b_visit_score_0: {hi: "0 · nahi kiya", mr: "0 · नाही", en: "0 · not done"}
b_visit_score_1: {hi: "1 · thoda", mr: "1 · थोडं", en: "1 · partly"}
b_visit_score_2: {hi: "2 · poora", mr: "2 · पूर्ण", en: "2 · fully"}
visit_ask_step: {hi: "*{step}: kaisa kiya?*\n\n{rubric}", mr: "*{step}: कसं केलं?*\n\n{rubric}", en: "*{step}: how did they do?*\n\n{rubric}"}
visit_rubric_validate:
  hi: "Jab aapne kuch aadha sahi kaha: 2 = pehle maana, phir pyaar se sudhaara · 1 = seedha sudhaara · 0 = bahas ki ya anasuna kiya."
  mr: "तुम्ही काहीसं बरोबर बोललात तेव्हा: 2 = आधी मान्य केलं, मग नम्रपणे दुरुस्त केलं · 1 = थेट दुरुस्त केलं · 0 = वाद घातला किंवा दुर्लक्ष केलं."
  en: "When you said something partly right: 2 = agreed first, then corrected politely · 1 = corrected bluntly · 0 = argued or ignored it."
visit_rubric_assess:
  hi: "Pehle product se pehle ghar ke baare mein sawaal: 2 = chaar ya zyada · 1 = do-teen · 0 = ek ya koi nahi."
  mr: "पहिल्या प्रॉडक्टआधी घराबद्दल प्रश्न: 2 = चार किंवा जास्त · 1 = दोन-तीन · 0 = एक किंवा एकही नाही."
  en: "Questions about your home before the first product: 2 = four or more · 1 = two or three · 0 = none or one."
visit_rubric_translate:
  hi: "Features aapke ghar ke hisaab se aam bhasha mein: 2 = zyada-tar · 1 = kuch · 0 = sirf specs."
  mr: "फीचर्स तुमच्या घराच्या दृष्टीने साध्या शब्दांत: 2 = बहुतेक · 1 = काही · 0 = फक्त स्पेक्स."
  en: "Features in everyday words for your home: 2 = most of them · 1 = some · 0 = only spec words."
visit_rubric_demonstrate:
  hi: "2 = do products ka farak saath dikhaya · 1 = ek product dikhaya · 0 = koi demo nahi."
  mr: "2 = दोन प्रॉडक्ट्सचा फरक शेजारी दाखवला · 1 = एक प्रॉडक्ट दाखवला · 0 = डेमो नाही."
  en: "2 = showed the difference side by side · 1 = showed one product · 0 = no demo."
visit_rubric_complete:
  hi: "2 = poora kharcha, ek-ek charge (installation, accessories, warranty) · 1 = thoda · 0 = sirf product ka daam."
  mr: "2 = पूर्ण खर्च, प्रत्येक चार्ज (इन्स्टॉलेशन, अॅक्सेसरीज, वॉरंटी) · 1 = थोडं · 0 = फक्त प्रॉडक्टची किंमत."
  en: "2 = the full cost, charge by charge (installation, accessories, warranty) · 1 = part of it · 0 = only the product price."
visit_rubric_close:
  hi: "2 = daam demo ke baad, aapne pehle poocha, koi dabaav nahi · 1 = demo ke baad, thoda dabaav · 0 = unhone pehle daam bola, ya dabaav."
  mr: "2 = किंमत डेमोनंतर, तुम्ही आधी विचारलं, दबाव नाही · 1 = डेमोनंतर, थोडा दबाव · 0 = त्यांनी आधी किंमत सांगितली, किंवा दबाव."
  en: "2 = price only after the demo, you asked first, no pressure · 1 = after the demo, some pressure · 0 = they led with the price, or pressure."
visit_rubric_follow_through:
  hi: "2 = consent li, summary bheji aur follow-up rakha · 1 = thoda · 0 = kuch nahi."
  mr: "2 = संमती घेतली, सारांश पाठवला आणि फॉलो-अप ठरवला · 1 = थोडं · 0 = काहीच नाही."
  en: "2 = took your consent, sent a summary and set a follow-up · 1 = some of it · 0 = none."
visit_card_caption:
  hi: "*Visit ka score: {total}/14* (7 mein se {n} steps).\n\nHar score sirf aapki baat se hai; card par wajah likhi hai."
  mr: "*भेटीचा स्कोअर: {total}/14* (7 पैकी {n} पायऱ्या).\n\nप्रत्येक स्कोअर फक्त तुम्ही सांगितलेल्यावरून; कारण कार्डवर आहे."
  en: "*The visit, scored: {total}/14* ({n} of 7 steps).\n\nEach score comes only from what you said; the card shows why."
visit_ready_missing:
  hi: "_Note mein nahi aaye steps: {k}. Voice se jodiye, ya unke bina save kijiye._"
  mr: "_नोटमध्ये न आलेल्या पायऱ्या: {k}. व्हॉइसने जोडा, किंवा त्यांच्याशिवाय सेव्ह करा._"
  en: "_Steps not in the note: {k}. Add them by voice, or save without them._"
