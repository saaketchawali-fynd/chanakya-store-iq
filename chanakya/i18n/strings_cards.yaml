# ---- "Complete it" (add-ons, a step up, combo offers)
bolo_addons:
  hi: "Aapke {product} ka poora maza lene ke liye, yeh saath mein achhe rahenge. Card par dekhiye."
  mr: "तुमच्या {product} चा पूर्ण आनंद घेण्यासाठी, हे सोबत छान राहतील. कार्डवर बघा."
  en: "To enjoy your {product} fully, these go well with it. Have a look at the card."
kyun_addons:
  hi: "Har ek unki kisi baat ke liye hai, aur sab data se"
  mr: "प्रत्येक गोष्ट त्यांनी सांगितलेल्या कशासाठी तरी, आणि सगळं डेटामधून"
  en: "Each one is for something they told you, and all from the data"
kyun_addons_combo: {hi: "Saath lene par −{amount}: {offer}", mr: "सोबत घेतल्यास −{amount}: {offer}", en: "Together, −{amount}: {offer}"}
kyun_addons_up:
  hi: "Ya {label}: +{diff}, roz lagbhag {day}"
  mr: "किंवा {label}: +{diff}, दररोज सुमारे {day}"
  en: "Or {label}: +{diff}, about {day} a day"
do_addons:
  hi: "Card dikhaiye aur unhe chunne dijiye; 'nahi' bhi bilkul theek hai, zor kabhi nahi."
  mr: "कार्ड दाखवा आणि त्यांना निवडू द्या; 'नाही' पण अगदी चालेल, आग्रह कधीच नाही."
  en: "Show the card and let them choose; a 'no' is perfectly fine, never push."
b_addons_all: {hi: "Sab jodiye", mr: "सगळं जोडा", en: "Add all"}
b_addons_pick: {hi: "Ek-ek chuniye", mr: "एकेक निवडा", en: "Choose"}
b_addons_none: {hi: "Abhi nahi", mr: "आत्ता नको", en: "Not now"}
list_addons: {hi: "Chuniye", mr: "निवडा", en: "Choose"}
addons_list_body:
  hi: "*Kaunsa jodein?*\n\nEk tap se ek judega; phir aur bhi jod sakte hain."
  mr: "*कोणतं जोडायचं?*\n\nएका टॅपने एक जोडलं जाईल; मग आणखीही जोडू शकता."
  en: "*Which ones?*\n\nOne tap adds one; you can add another after."
addons_more_body:
  hi: "*Jod diya: {item}.*\n\nAur kuch?"
  mr: "*जोडलं: {item}.*\n\nआणखी काही?"
  en: "*Added: {item}.*\n\nAnything else?"
