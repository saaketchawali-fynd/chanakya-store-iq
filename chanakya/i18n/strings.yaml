# review tips (Section 15)
tip_validate: {hi: "Customer ki baat pehle maaniye: 'Bahut sahi socha hai…'", mr: "ग्राहकाचं म्हणणं आधी मान्य करा: 'छान विचार केलाय…'", en: "Agree first: 'Good thinking…'"}
tip_assess: {hi: "Product se pehle 4 ghar ke sawaal: doori, roshni, kaun dekhta, deewar.", mr: "उत्पादनाआधी घराचे 4 प्रश्न: अंतर, प्रकाश, कोण पाहतं, भिंत.", en: "Four home questions before any product: distance, light, who watches, wall."}
tip_translate: {hi: "Har feature ke saath 'kyunki aapke ghar mein…' jodiye.", mr: "प्रत्येक फीचरसोबत 'कारण तुमच्या घरात…' जोडा.", en: "Add 'because your home…' to every feature."}
tip_demonstrate: {hi: "Batane se pehle dikhaiye: ek farak, 20 second.", mr: "सांगण्याआधी दाखवा: एक फरक, 20 सेकंद.", en: "Show before you tell: one difference, 20 seconds."}
tip_complete: {hi: "Poora kharcha card dikhaiye — bill = card.", mr: "पूर्ण खर्चाचं कार्ड दाखवा — बिल = कार्ड.", en: "Show the full-cost card: the bill equals the card."}
tip_close: {hi: "Daam demo ke baad; EMI ka poora kharcha ek line mein.", mr: "किंमत डेमोनंतर; EMI चा पूर्ण खर्च एका ओळीत.", en: "Price after the demo; the full EMI cost in one line."}
tip_follow_through: {hi: "Jaane se pehle: consent, Parivaar Card, aur ek task.", mr: "जाण्याआधी: संमती, परिवार कार्ड आणि एक टास्क.", en: "Before they leave: consent, the family card and one task."}

# Chanakya Niti (Section 2.2)
niti_brief: {hi: "दिन की शुरुआत, तैयारी के साथ।", mr: "दिवसाची सुरुवात तयारीने.", en: "Start the day prepared."}
niti_assess: {hi: "प्रोडक्ट से पहले घर।", mr: "उत्पादनाआधी घर.", en: "The home before the product."}
niti_validate: {hi: "पहले मानो, फिर समझाओ।", mr: "आधी मान्य करा, मग समजवा.", en: "Agree first, then explain."}
niti_translate: {hi: "स्पेक नहीं, ज़िंदगी।", mr: "स्पेक नाही, रोजचं जगणं.", en: "Not specs: daily life."}
niti_recommend: {hi: "बताओ कम, दिखाओ ज़्यादा।", mr: "कमी सांगा, जास्त दाखवा.", en: "Tell less, show more."}
niti_complete: {hi: "पूरा खर्चा, कोई सरप्राइज़ नहीं।", mr: "पूर्ण खर्च, कोणतंही सरप्राइज नाही.", en: "Full cost, no surprise."}
niti_close: {hi: "दाम आख़िर में, सच के साथ।", mr: "किंमत शेवटी, खरेपणाने.", en: "Price last, with the truth."}
niti_follow: {hi: "बिक्री के बाद रिश्ता शुरू।", mr: "विक्रीनंतर नातं सुरू.", en: "After the sale, the relationship begins."}
niti_review: {hi: "हर ग्राहक, एक सीख।", mr: "प्रत्येक ग्राहक, एक धडा.", en: "Every customer, a lesson."}
