# messages (≤ 3 lines when combined)
new_customer_lang: {hi: "Naya customer {code}. Customer ki bhasha?", mr: "नवीन ग्राहक {code}. ग्राहकाची भाषा?", en: "New customer {code}. Customer's language?"}
gate_options: {hi: "Options se pehle {n} aur ghar ke sawaal.", mr: "पर्यायांआधी घराचे आणखी {n} प्रश्न.", en: "{n} more home questions before options."}
budget_ask: {hi: "Customer ne budget bataya? (Aap set kariye, andaze se nahi)", mr: "ग्राहकाने बजेट सांगितलं? (तुम्ही ठरवा, अंदाजाने नाही)", en: "Did the customer state a budget? (You set it; never guess)"}
room_photo_ask: {hi: "Customer ke phone mein ghar ki photo ho to maangiye — deewar par dikha dunga.", mr: "ग्राहकाच्या फोनमध्ये घराचा फोटो असेल तर मागा — भिंतीवर दाखवतो.", en: "Ask for a photo of their room; I'll show it on their wall."}
wall_width_ask: {hi: "Deewar lagbhag kitni chaudi hai?", mr: "भिंत साधारण किती रुंद आहे?", en: "Roughly how wide is the wall?"}
label_unknown: {hi: "Label saaf nahi padha. 20 cm door se, bina flash, dobara photo bhejiye.", mr: "लेबल स्पष्ट वाचता आलं नाही. 20 cm अंतरावरून, फ्लॅशशिवाय पुन्हा फोटो पाठवा.", en: "Couldn't read the label. Retake from 20 cm, without flash."}
not_in_data: {hi: "Ye data mein nahi hai — andaza mat boliye. Expert se poochh raha hoon.", mr: "हे डेटामध्ये नाही — अंदाज सांगू नका. एक्सपर्टला विचारतोय.", en: "That's not in the data, so don't guess. I'm asking an expert."}
truth_check_no: {hi: "Data mein nahi. Mat boliye.", mr: "डेटामध्ये नाही. सांगू नका.", en: "Not in the data. Don't say it."}
no_invented_discount: {hi: "Aisa koi offer aaj ke data mein nahi hai. Manager se poochhein?", mr: "असा कोणताही ऑफर आजच्या डेटामध्ये नाही. मॅनेजरला विचारू?", en: "No such offer in today's data. Ask the manager?"}
no_looks: {hi: "Main dikhawat se andaza nahi lagata. Poochhiye: 'Aapne kitne tak ka socha hai?'", mr: "मी दिसण्यावरून अंदाज लावत नाही. विचारा: 'तुम्ही किती पर्यंत विचार केला आहे?'", en: "I never judge by looks. Ask: 'What range did you have in mind?'"}
override_logged: {hi: "Theek hai, aapka faisla ✓ (note kar liya)", mr: "ठीक आहे, तुमचा निर्णय ✓ (नोंद केली)", en: "OK, your call ✓ (noted)"}

