# Saral Samjhao from the backend's own words (user, 4 Nov 2026).
#
# A theme is found on a product when one of its product's own highlight lines (Jio `highlights` or the `features`
# list) matches a line pattern. The `say` words state only what that highlight says, in daily-life terms; the
# highlight itself is quoted as the proof. A theme matters to a customer when one of its `needs` holds on the
# Home Card (or a want from the data questions); otherwise it is a general point ("also worth knowing").
#
# needs: {id, slot, in: [values]} | {id, slot, gte: n (numeric slot)} | {id, want: key}; w = how much it matters.
# covers: fit rules that already judge this from a spec; when the product carries that spec, the rule decides.
# keywords: words that name this need in a note (offline rules; the AI maps by meaning)
# specs: backend spec fields that show the theme too (when no highlight does): {key, line (which line's words),
#        proof (for a yes/no flag; otherwise the value itself is quoted)}.
# Technical terms stay English inside hi / mr (stabiliser, inverter, apps, HDR …).

