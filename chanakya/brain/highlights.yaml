say:  # {prefix}: {line}. It has '{proof}'.
  en: "{prefix}: {line}. It has '{proof}'."
  hi: "{prefix}: {line}. Ismein '{proof}' hai."
  mr: "{prefix}: {line}. यात '{proof}' आहे."

themes:
  tv:
    - id: sound
      label: "sound features"
      demo_one: {hi: "Kam volume par ek dialogue scene chalaiye", en: "Play a dialogue scene at a low volume", mr: "कमी आवाजात एक संवादाचा सीन लावा"}
      keywords: ["dialogue", "sunai nahi", "sunayi nahi", "awaaz", "aawaz", "sound", "speaker", "volume", "suna nahi", "आवाज़", "आवाज", "सुनाई नहीं", "ऐकू येत नाही", "ऐकू", "bass"]
      specs: [{key: dialogue_enhance, line: 0, proof: "Dialogue enhance"}, {key: dolby_atmos, line: 1, proof: "Dolby Atmos"}]
      needs:
        - {id: elders, slot: elders, in: ["yes"], w: 2}
        - {id: no_soundbar, slot: soundbar, in: ["no", thinking], w: 1.5}
        - {id: far_seat, slot: seat_distance, gte: 10, w: 1}
      covers: [dialogue_ok]
      general: 0.5
      lines:
        - rx: 'dialogue|clear ?voice|clear ?audio|voice clarity'
          en: "voices and dialogue come through clearer"
          hi: "awaaz aur dialogue zyada saaf sunai dete hain"
          mr: "आवाज आणि संवाद अधिक स्पष्ट ऐकू येतात"
        - rx: 'atmos|\bdts\b|surround|virtual ?:?x|object tracking|3d sound|spatial'
          en: "sound that fills the room, all around you"
          hi: "awaaz poore kamre mein chaaron taraf se aati hai"
          mr: "आवाज संपूर्ण खोलीत चहूबाजूंनी येतो"
        - rx: 'audio booster|sound booster|dolby audio|\b\d{2}\s?w\b|\bwatts?\b|speakers?\b|\bbass\b'
          en: "fuller, louder sound from the TV itself"
          hi: "TV se hi bharpoor, damdaar awaaz"
          mr: "टीव्हीमधूनच भरपूर, दमदार आवाज"
      demo:
        hi: "Dono par same kam volume mein ek dialogue scene chalaiye"
        en: "Play a dialogue scene at the same low volume on both"
        mr: "दोन्हीवर सारख्या कमी आवाजात एक संवादाचा सीन लावा"
    - id: picture
      label: "HDR / picture tech"
      demo_one: {hi: "Ek andhera movie scene (HDR demo) chalaiye", en: "Play a dark movie scene (HDR demo)", mr: "एक गडद चित्रपट दृश्य (HDR demo) लावा"}
      keywords: ["picture", "picture quality", "clarity", "hdr", "colour", "color", "sharp", "movie", "movies", "film", "cinema", "पिक्चर", "रंग", "सिनेमा", "फ़िल्म", "चित्रपट"]
      specs: [{key: hdr_formats, line: 0}]
      needs:
        - {id: movies, slot: content, in: [movies], w: 2}
        - {id: serials, slot: content, in: [serials], w: 1}
        - {id: dim_room, slot: room_light, in: [dim], w: 1}
        - {id: as_asked, want: panel, w: 1.5}
        - {id: as_asked, want: resolution, w: 1.5}
      covers: [dark_ok]
      general: 0.6
      lines:
        - rx: 'dolby vision|hdr ?10|\bhdr\b|\bhlg\b|high dynamic range'
          en: "more detail in the bright and the dark parts of every scene"
          hi: "har scene ke ujle aur andhere hisson mein zyada detail"
          mr: "प्रत्येक दृश्याच्या उजळ आणि गडद भागांत अधिक तपशील"
        - rx: 'dimming|contrast|true black|deep black'
          en: "deeper blacks in night and movie scenes"
          hi: "raat aur movie ke scene mein gehra kaala rang"
          mr: "रात्रीच्या आणि चित्रपटाच्या दृश्यांत गडद काळा रंग"
        - rx: 'upscal|x-?reality|picture processor|crystal processor|ai processor|4k processor|\balpha \d'
          en: "everyday channels and YouTube look sharper"
          hi: "roz ke channel aur YouTube bhi zyada sharp dikhte hain"
          mr: "रोजचे चॅनेल आणि YouTube अधिक स्पष्ट दिसतात"
        - rx: 'hexa drive|colou?r|quantum|nano ?cell|\bqled\b|triluminos|billion'
          en: "richer, more natural colours"
          hi: "zyada gehre aur asli rang"
          mr: "अधिक गडद आणि नैसर्गिक रंग"
      demo:
        hi: "Dono par ek andhera movie scene (HDR demo) saath-saath chalaiye"
        en: "Play a dark movie scene (HDR demo) on both, side by side"
        mr: "दोन्हीवर एक गडद चित्रपट दृश्य (HDR demo) शेजारी-शेजारी लावा"
