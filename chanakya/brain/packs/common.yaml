myths:
  - id: gen_online_cheaper
    short: {hi: "Online sasta hai", mr: "ऑनलाइन स्वस्त आहे", en: "Cheaper online"}
    belief: "It is cheaper online"
    proof: kharcha
    keywords: ["online sasta", "online saste", "online cheaper", "amazon pe", "flipkart pe", "ऑनलाइन सस्ता", "ऑनलाइन स्वस्त"]
    line: {hi: "सही, ऑनलाइन दाम कभी-कभी कम दिखता है। पूरा खर्च मिलाकर देखें — इंस्टॉलेशन, वारंटी, एक्सचेंज सब यहीं।",
           mr: "बरोबर, ऑनलाइन किंमत कधी कधी कमी दिसते. पूर्ण खर्च मिळून पाहू — इन्स्टॉलेशन, वॉरंटी, एक्सचेंज सगळं इथेच.",
           en: "True, online prices can look lower. Let's compare the full cost: installation, warranty and exchange are all here."}
  - id: gen_only_two_brands
    short: {hi: "Sirf 2 brand achhe", mr: "फक्त 2 ब्रँड चांगले", en: "Only 2 brands are good"}
    belief: "Only one or two brands are real or good"
    proof: null
    keywords: ["sirf do brand", "only two brands", "wahi brand achha", "baaki brand bekaar", "सिर्फ़ दो ब्रांड", "फक्त दोन ब्रँड"]
    line: {hi: "ये ब्रांड भरोसेमंद हैं, सही। पर हर ब्रांड के अच्छे मॉडल हैं — आपके घर के हिसाब से फ़िट देखते हैं।",
           mr: "हे ब्रँड विश्वासार्ह आहेत, बरोबर. पण प्रत्येक ब्रँडचे चांगले मॉडेल आहेत — तुमच्या घरानुसार योग्य बघू.",
           en: "Those brands are trusted, yes. Every brand has good models, so let's match one to your home."}
objections:
  too_expensive:
    keywords: ["bahut mehenga", "bahut mehnga", "too expensive", "costly hai", "budget se bahar", "बहुत महंगा", "खूप महाग"]
    line: {hi: "समझ सकता हूँ, बजट मायने रखता है। आपके घर के लिए कम खर्च वाला सही विकल्प भी है — दिखाऊँ?",
           mr: "समजू शकतो, बजेट महत्त्वाचं आहे. तुमच्या घरासाठी कमी खर्चाचा योग्य पर्यायही आहे — दाखवू?",
           en: "I understand, budget matters. There's a lower-cost option that still fits your home. Shall I show it?"}
    buttons: [value_option, emi, exchange]
  cheaper_online:
    use_myth: gen_online_cheaper
    keywords: ["online sasta", "online saste", "online cheaper", "online kam", "ऑनलाइन सस्ता", "ऑनलाइन स्वस्त"]
    buttons: [cost_show, offers, go]
  need_to_think:
    keywords: ["soch ke", "sochke", "sochna hai", "think about it", "baad mein aayenge", "सोचकर", "सोचना है", "विचार करून"]
    line: {hi: "बिल्कुल, सोचकर लीजिए। सब कुछ आपके WhatsApp पर भेज दूँ, ताकि घर पर सब देख सकें?",
           mr: "नक्कीच, विचार करून घ्या. सगळं तुमच्या WhatsApp वर पाठवू, म्हणजे घरी सगळे पाहू शकतील?",
           en: "Of course, take your time. Shall I send everything to your WhatsApp so the family can see it?"}
    buttons: [parivaar, task, go]
  brand_doubt:
    keywords: ["brand pe bharosa nahi", "naya brand", "ye brand kaisa", "brand doubt", "ब्रांड पर भरोसा नहीं", "ब्रँडवर विश्वास नाही"]
    line: {hi: "सवाल सही है। वारंटी और सर्विस की पूरी जानकारी कार्ड पर है — साथ में देखते हैं।",
           mr: "प्रश्न योग्य आहे. वॉरंटी आणि सर्व्हिसची पूर्ण माहिती कार्डवर आहे — सोबत बघूया.",
           en: "Fair question. Warranty and service details are on the card; let's look together."}
    buttons: [cost_show, expert, go]
  ask_family:
    keywords: ["ghar pe pooch", "ghar par pooch", "wife se pooch", "biwi se pooch", "papa se pooch", "family se pooch", "ask my wife", "ask family", "घर पर पूछ", "घरी विचार"]
    line: {hi: "बिल्कुल, घरवालों के साथ तय करना सही है। पूरी जानकारी — फ़ोटो, पूरा खर्च और ऑफ़र — उन्हें WhatsApp पर भेज दूँ?",
           mr: "नक्कीच, घरच्यांसोबत ठरवणं योग्य आहे. पूर्ण माहिती — फोटो, पूर्ण खर्च आणि ऑफर — त्यांना WhatsApp वर पाठवू?",
           en: "Of course, decide it together at home. Shall I send the family everything on WhatsApp: photo, full cost and offers?"}
    buttons: [parivaar_family, task, go]
  installation_worry:
    keywords: ["installation ki tension", "installer nahi aaya", "installation worry", "install ka dar", "इंस्टॉलेशन की चिंता", "इन्स्टॉलेशनची काळजी"]
    line: {hi: "चिंता सही है। इंस्टॉलर को पहले से दीवार, सॉकेट और मंज़िल की जानकारी जाएगी, और चालू होने तक हम साथ हैं।",
           mr: "काळजी रास्त आहे. इन्स्टॉलरला आधीच भिंत, सॉकेट आणि मजल्याची माहिती जाईल, आणि चालू होईपर्यंत आम्ही सोबत आहोत.",
           en: "Fair worry. The installer gets your wall, socket and floor details in advance, and we stay with you until it works."}
    buttons: [cost_show, parivaar, go]
  waiting_for_sale:
    keywords: ["sale ka wait", "sale mein lenge", "diwali sale", "waiting for sale", "सेल का इंतज़ार", "सेलची वाट"]
    line: {hi: "सही सोच है। आज के ऑफ़र {valid_to} तक हैं — तारीख़ कार्ड पर लिख दी है।",
           mr: "योग्य विचार आहे. आजच्या ऑफर {valid_to} पर्यंत आहेत — तारीख कार्डवर लिहिली आहे.",
           en: "Makes sense. Today's offers run until {valid_to}; the date is on the card."}
    buttons: [parivaar, task, go]
