    line: {hi: "Pehle zaroori tha, sahi. Kai naye fridge bina stabiliser chalte hain — label par voltage range dekhte hain.", mr: "आधी गरजेचा होता, बरोबर. अनेक नवीन फ्रिज स्टॅबिलायझरशिवाय चालतात — लेबलवर व्होल्टेज रेंज बघू.", en: "It used to be needed, yes. Many new fridges run without one: let's check the voltage range on the label."}
