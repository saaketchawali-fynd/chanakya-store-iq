category: fridge
label: {hi: "Fridge", mr: "फ्रिज", en: "Fridge"}
required_slots: [family_size, shopping, space_width, power_cuts]
ask_order: [family_size, shopping, space_width, power_cuts]  # the product's 4 home questions, nothing else (user, 11 Nov 2026)
complete_slots: []
placeable: true
gate_min_slots: 4
cost_slots: []
budget_bands:
  - {id: b1, inr: 25000, title: {hi: "25k tak", mr: "25k पर्यंत", en: "Up to 25k"}}
  - {id: b2, inr: 40000, title: {hi: "25k–50k", mr: "25k–50k", en: "25k–50k"}}
  - {id: b3, inr: 70000, title: {hi: "50k se upar", mr: "50k पेक्षा जास्त", en: "Above 50k"}}
  - {id: none, inr: null, title: {hi: "Nahi bataya", mr: "सांगितलं नाही", en: "Not told"}}
slots:
  - id: trigger
    phase: open
    title: {hi: "Kyun abhi", mr: "आत्ता का", en: "Why now"}
    ask: {hi: "Purana fridge badalna hai, ya naya le rahe hain?", mr: "जुना फ्रिज बदलायचा आहे, की नवीन घेताय?", en: "Is this replacing an old fridge, or a new one?"}
    why: {hi: "Purana ho to wahi anchor hai: size, exchange aur jagah pehle se pata", mr: "जुनं असेल तर तेच माप: साइज, एक्सचेंज आणि जागा आधीच माहीत", en: "A replacement tells us the size, the exchange and the space already"}
    quick:
      - {id: replace, title: {hi: "Purana badalna", mr: "जुना बदलायचा", en: "Replacing old"}}
      - {id: new_home, title: {hi: "Naya ghar", mr: "नवीन घर", en: "New home"}}
      - {id: first, title: {hi: "Pehla fridge", mr: "पहिला फ्रिज", en: "First fridge"}}
    values: [replace, new_home, first]
    value_titles:
      replace: {hi: "Purana badalna", mr: "जुना बदलायचा", en: "Replacing old"}
      new_home: {hi: "Naya ghar", mr: "नवीन घर", en: "New home"}
      first: {hi: "Pehla fridge", mr: "पहिला फ्रिज", en: "First fridge"}
    keywords:
      replace: ["purana", "badalna", "replace", "old fridge", "पुराना", "जुना"]
      new_home: ["naya ghar", "new home", "new flat", "नया घर", "नवीन घर"]
      first: ["pehla fridge", "first fridge", "पहला फ्रिज", "पहिला फ्रिज"]
  - id: family_size
    phase: life
    number: family_size
    title: {hi: "Ghar ke log", mr: "घरातील लोक", en: "People at home"}
    ask: {hi: "Ghar mein kitne log hain?", mr: "घरात किती लोक आहेत?", en: "How many people live at home?"}
    why: {hi: "Logon se litre tay hote hain", mr: "लोकांवरून litre ठरतात", en: "People decide the litres"}
    quick:
      - {id: f1_2, number: 2, title: {hi: "1–2 log", mr: "1–2 लोक", en: "1–2 people"}}
      - {id: f3_4, number: 4, title: {hi: "3–4 log", mr: "3–4 लोक", en: "3–4 people"}}
      - {id: f5plus, number: 6, title: {hi: "5+ log", mr: "5+ लोक", en: "5+ people"}}
    values: [f1_2, f3_4, f5plus]
    value_titles:
      f1_2: {hi: "1–2 log", mr: "1–2 लोक", en: "1–2 people"}
      f3_4: {hi: "3–4 log", mr: "3–4 लोक", en: "3–4 people"}
      f5plus: {hi: "5+ log", mr: "5+ लोक", en: "5+ people"}
    bands: [{max: 2, value: f1_2}, {max: 4, value: f3_4}, {max: 99, value: f5plus}]
    priors: {f1_2: 0.25, f3_4: 0.5, f5plus: 0.25}
    keywords:
      f1_2: ["do log", "akele", "couple", "दो लोग", "दोघं"]
      f3_4: ["chaar log", "teen log", "char log", "चार लोग", "तीन लोग", "चार लोक"]
      f5plus: ["joint family", "paanch log", "bada parivaar", "संयुक्त", "पाँच लोग", "पाच लोक"]
  - id: shopping
    phase: life
    title: {hi: "Kharidari", mr: "खरेदी", en: "Shopping"}
    ask: {hi: "Sabzi-doodh roz laate hain, ya hafte bhar ka ek saath? Frozen cheezein bhi rakhte hain?", mr: "भाजी-दूध रोज आणता, की आठवड्याचं एकदम? फ्रोझन पदार्थही ठेवता?", en: "Do you buy vegetables and milk daily, or a week's stock at once? Frozen food too?"}
    why: {hi: "Isse freezer aur sabzi ke dabbe ka size tay hota hai", mr: "यावरून फ्रीझर आणि भाजीच्या डब्याचा आकार ठरतो", en: "This decides the freezer and the vegetable box size"}
    quick:
      - {id: daily, title: {hi: "Roz taaza", mr: "रोज ताजं", en: "Fresh, daily"}}
      - {id: weekly, title: {hi: "Hafte bhar ka", mr: "आठवड्याचं एकदम", en: "Weekly stock-up"}}
      - {id: frozen, title: {hi: "Frozen zyada", mr: "फ्रोझन जास्त", en: "Lots of frozen"}}
    values: [daily, weekly, frozen]
    value_titles:
      daily: {hi: "Roz taaza saamaan", mr: "रोज ताजं सामान", en: "Fresh, daily"}
      weekly: {hi: "Hafte bhar ka ek saath", mr: "आठवड्याचं एकदम", en: "Weekly stock-up"}
      frozen: {hi: "Frozen cheezein zyada", mr: "फ्रोझन पदार्थ जास्त", en: "Lots of frozen food"}
    priors: {daily: 0.45, weekly: 0.4, frozen: 0.15}
    keywords:
      daily: ["roz", "daily", "taaza", "fresh", "रोज़", "ताज़ा", "रोज"]
      weekly: ["hafte", "weekly", "ek saath", "dmart", "हफ़्ते", "आठवड्याचं"]
      frozen: ["frozen", "ice cream", "non veg", "chicken", "फ्रोज़न", "आइसक्रीम", "फ्रोझन"]
  - id: space_width
    phase: life
    number: fridge_width_cm
    title: {hi: "Jagah ki chaudai", mr: "जागेची रुंदी", en: "Space width"}
    ask: {hi: "Kitchen mein fridge ki jagah kitni chaudi hai?", mr: "किचनमध्ये फ्रिजची जागा किती रुंद आहे?", en: "How wide is the fridge spot in the kitchen?"}
    why: {hi: "Jagah se door type tay hota hai — single, double ya side-by-side", mr: "जागेवरून दरवाज्याचा प्रकार ठरतो — सिंगल, डबल की साइड-बाय-साइड", en: "The width decides single door, double door or side-by-side"}
    quick:
      - {id: w_lt65, number: 62, title: {hi: "65 cm se kam", mr: "65 cm पेक्षा कमी", en: "Under 65 cm"}}
      - {id: w65_80, number: 78, title: {hi: "65–80 cm", mr: "65–80 cm", en: "65–80 cm"}}
      - {id: w_gt80, number: 95, title: {hi: "80 cm se zyada", mr: "80 cm पेक्षा जास्त", en: "Over 80 cm"}}
    values: [w_lt65, w65_80, w_gt80]
    value_titles:
      w_lt65: {hi: "65 cm se kam", mr: "65 cm पेक्षा कमी", en: "Under 65 cm"}
      w65_80: {hi: "65–80 cm", mr: "65–80 cm", en: "65–80 cm"}
      w_gt80: {hi: "80 cm se zyada", mr: "80 cm पेक्षा जास्त", en: "Over 80 cm"}
    bands: [{max: 64.9, value: w_lt65}, {max: 80, value: w65_80}, {max: 999, value: w_gt80}]
    priors: {w_lt65: 0.45, w65_80: 0.4, w_gt80: 0.15}
  - id: power_cuts
    phase: life
    title: {hi: "Bijli", mr: "वीज", en: "Power"}
    ask: {hi: "Aapke yahan bijli jaati hai ya voltage upar-neeche hota hai?", mr: "तुमच्याकडे वीज जाते का, किंवा व्होल्टेज कमी-जास्त होतं का?", en: "Do you get power cuts or voltage drops?"}
    why: {hi: "Bijli jaane par thandak aur stabiliser ka kharcha isi se tay", mr: "वीज गेल्यावर थंडावा आणि स्टॅबिलायझरचा खर्च यावरून ठरतो", en: "This decides cooling in a cut and whether a stabiliser is needed"}
    quick:
      - {id: "yes", title: {hi: "Haan, hota hai", mr: "हो, होतं", en: "Yes, often"}}
      - {id: "no", title: {hi: "Nahi", mr: "नाही", en: "Rarely"}}
    values: ["yes", "no"]
    value_titles:
      "yes": {hi: "Bijli jaati hai", mr: "वीज जाते", en: "Power cuts"}
      "no": {hi: "Bijli theek", mr: "वीज ठीक", en: "Power is stable"}
    priors: {"yes": 0.45, "no": 0.55}
    keywords:
      "yes": ["light jaati", "bijli jaati", "power cut", "voltage", "वोल्टेज", "बिजली जाती", "वीज जाते"]
  - id: decider
    phase: life
    title: {hi: "Faisla", mr: "निर्णय", en: "Decider"}
    ask: {hi: "Faisla aap hi lenge ya ghar par kisi se poochna hai?", mr: "निर्णय तुम्हीच घेणार की घरी कोणाला विचारायचं आहे?", en: "Will you decide, or do you need to ask someone at home?"}
    why: {hi: "Jo faisla karega, use bhi poori jaankari pahunche", mr: "जो निर्णय घेईल त्यालाही पूर्ण माहिती पोहोचावी", en: "Whoever decides should get the full picture"}
    quick:
      - {id: self, title: {hi: "Khud", mr: "स्वतः", en: "Myself"}}
      - {id: family, title: {hi: "Ghar pe poochna", mr: "घरी विचारायचं", en: "Ask family"}}
      - {id: together, title: {hi: "Saath mein", mr: "सोबत", en: "Together"}}
    values: [self, family, together]
    value_titles:
      self: {hi: "Khud faisla", mr: "स्वतः निर्णय", en: "Decides alone"}
      family: {hi: "Ghar pe poochna", mr: "घरी विचारायचं", en: "Asks family"}
      together: {hi: "Saath mein faisla", mr: "सोबत निर्णय", en: "Decides together"}
    priors: {self: 0.4, family: 0.4, together: 0.2}
  - id: exchange_old
    phase: tech
    title: {hi: "Exchange", mr: "एक्सचेंज", en: "Exchange"}
    ask: {hi: "Purana fridge chalu haalat mein hai?", mr: "जुना फ्रिज चालू स्थितीत आहे?", en: "Is the old fridge still working?"}
    why: {hi: "Exchange ki keemat isi se tay hoti hai", mr: "एक्सचेंजची किंमत यावरून ठरते", en: "This decides the exchange value"}
    quick:
      - {id: yes_working, title: {hi: "Haan, chalta hai", mr: "हो, चालतो", en: "Yes, working"}}
      - {id: yes_dead, title: {hi: "Haan, kharab", mr: "हो, खराब", en: "Yes, not working"}}
      - {id: "no", title: {hi: "Exchange nahi", mr: "एक्सचेंज नाही", en: "No exchange"}}
    values: [yes_working, yes_dead, "no"]
    value_titles:
      yes_working: {hi: "Purana chalta hai", mr: "जुना चालतो", en: "Old one works"}
      yes_dead: {hi: "Purana kharab", mr: "जुना खराब", en: "Old one not working"}
      "no": {hi: "Exchange nahi", mr: "एक्सचेंज नाही", en: "No exchange"}
    priors: {yes_working: 0.35, yes_dead: 0.15, "no": 0.5}
  - id: socket_near
    phase: site
    title: {hi: "Socket", mr: "सॉकेट", en: "Socket"}
    ask: {hi: "Fridge ki jagah ke paas bijli ka socket hai?", mr: "फ्रिजच्या जागेजवळ सॉकेट आहे?", en: "Is there a power socket near the fridge spot?"}
    why: {hi: "Delivery ke din extension na lagana pade", mr: "डिलिव्हरीच्या दिवशी एक्स्टेंशन लागू नये", en: "So no extension cord is needed on delivery day"}
    quick:
      - {id: "yes", title: {hi: "Haan", mr: "हो", en: "Yes"}}
      - {id: "no", title: {hi: "Nahi", mr: "नाही", en: "No"}}
      - {id: unknown, title: {hi: "Pata nahi", mr: "माहीत नाही", en: "Not sure"}}
    values: ["yes", "no", unknown]
    value_titles:
      "yes": {hi: "Socket paas mein", mr: "सॉकेट जवळ", en: "Socket nearby"}
      "no": {hi: "Socket nahi", mr: "सॉकेट नाही", en: "No socket"}
      unknown: {hi: "Pata nahi", mr: "माहीत नाही", en: "Not sure"}
    priors: {"yes": 0.8, "no": 0.1, unknown: 0.1}
  - id: floor_lift
    phase: site
    title: {hi: "Manzil", mr: "मजला", en: "Floor"}
    ask: {hi: "Ghar kaunse floor par hai, lift hai?", mr: "घर कोणत्या मजल्यावर आहे, लिफ्ट आहे का?", en: "Which floor is the home on, and is there a lift?"}
    why: {hi: "Bade fridge ke liye lift ya seedhi ki chaudai dekhni hai", mr: "मोठ्या फ्रिजसाठी लिफ्ट किंवा जिन्याची रुंदी बघायची", en: "A big fridge needs a lift or a wide staircase"}
    quick:
      - {id: lift, title: {hi: "Lift hai", mr: "लिफ्ट आहे", en: "Has a lift"}}
      - {id: stairs, title: {hi: "Seedhi se", mr: "जिन्याने", en: "Stairs only"}}
      - {id: ground, title: {hi: "Ground floor", mr: "तळमजला", en: "Ground floor"}}
    values: [lift, stairs, ground]
    value_titles:
      lift: {hi: "Lift hai", mr: "लिफ्ट आहे", en: "Has a lift"}
      stairs: {hi: "Seedhi se", mr: "जिन्याने", en: "Stairs only"}
      ground: {hi: "Ground floor", mr: "तळमजला", en: "Ground floor"}
    priors: {lift: 0.7, stairs: 0.2, ground: 0.1}
fit_rules:
  - {id: capacity_ok, weight: 3, slot: family_size, kind: capacity_band}
  - {id: width_fit, weight: 1, slot: space_width, kind: width_fit, hard: true}
  - {id: freezer_ok, weight: 2, slot: shopping, when: {in: [weekly, frozen]}, spec_any: [{freezer_l: {gte: 70}}, {convertible: {eq: true}}], else: 0.3}
  - {id: fresh_ok, weight: 1.5, slot: shopping, when: {in: [daily]}, spec_any: [{crisper_l: {gte: 25}}], else: 0.5}
  - {id: power_ok, weight: 2, slot: power_cuts, when: {in: ["yes"]}, spec_any: [{stabiliser_free: {eq: true}}], else: 0.3}
  - {id: retention_ok, weight: 1, slot: power_cuts, when: {in: ["yes"]}, spec_any: [{cooling_retention_h: {gte: 10}}], else: 0.4}
reasons:
  capacity_ok: {hi: "{people} logon ke liye sahi litre", mr: "{people} लोकांसाठी योग्य litre", en: "Right litres for {people} people"}
  width_fit: {hi: "Aapki jagah mein fit", mr: "तुमच्या जागेत बसतो", en: "Fits your kitchen spot"}
  freezer_ok: {hi: "Hafte bhar ke saamaan ke liye freezer", mr: "आठवड्याच्या सामानासाठी फ्रीझर", en: "Freezer room for a week's stock"}
  fresh_ok: {hi: "Roz ki sabzi ke liye bada dabba", mr: "रोजच्या भाजीसाठी मोठा डबा", en: "Big vegetable box for daily greens"}
  power_ok: {hi: "Bina stabiliser, bijli jaane par bhi", mr: "स्टॅबिलायझरशिवाय, वीज गेली तरी", en: "No stabiliser needed, even with cuts"}
  retention_ok: {hi: "Bijli jaane par der tak thanda", mr: "वीज गेल्यावर बराच वेळ थंड", en: "Stays cold for hours in a power cut"}
  value_fit: {hi: "Ghar ke liye kaafi, kam kharcha", mr: "घरासाठी पुरेसा, कमी खर्च", en: "Enough for the home, costs less"}
  step_up: {hi: "Zyada litre, aage ke liye", mr: "जास्त litre, पुढच्यासाठी", en: "More litres for the years ahead"}
benefits:
  - id: b_litres
    weight: 3
    when_spec: {capacity_l: {gte: 1}}
    when_slots: {family_size: {known: true}}
    cites: [family_size]
    say: {hi: "{capacity_l} L matlab {people} logon ka hafte bhar ka doodh, sabzi aur bacha khana aaram se.", mr: "{capacity_l} L म्हणजे {people} लोकांचं आठवड्याचं दूध, भाजी आणि उरलेलं जेवण आरामात.", en: "{capacity_l} litres: a week's milk, vegetables and leftovers for {people} people, with room to spare."}
    card: {hi: "Hafte bhar ka saamaan aaram se", mr: "आठवड्याचं सामान आरामात", en: "A week's food, with room"}
  - id: b_freezer
    weight: 2
    general: true
    when_spec: {freezer_l: {gte: 70}}
    when_slots: {shopping: {in: [weekly, frozen]}}
    cites: [shopping]
    say: {hi: "{freezer_l} L ka freezer — ice cream, matar aur hafte bhar ka stock ek saath.", mr: "{freezer_l} L चा फ्रीझर — आइसक्रीम, मटार आणि आठवड्याचा स्टॉक एकत्र.", en: "A {freezer_l}-litre freezer: ice cream, frozen peas and a week's stock together."}
    card: {hi: "Bada freezer, hafte ka stock", mr: "मोठा फ्रीझर, आठवड्याचा स्टॉक", en: "Big freezer for the week"}
  - id: b_convertible
    weight: 1.5
    general: true
    when_spec: {convertible: {eq: true}}
    when_slots: {shopping: {known: true}}
    cites: [shopping]
    say: {hi: "Mehmaan aayein ya sabzi zyada ho, to freezer ko fridge bana lijiye.", mr: "पाहुणे आले किंवा भाजी जास्त असेल, तर फ्रीझरचा फ्रिज करा.", en: "Guests coming or extra vegetables? Turn the freezer into fridge space."}
    card: {hi: "Freezer ko fridge banaiye", mr: "फ्रीझरचा फ्रिज करा", en: "Freezer turns into fridge"}
  - id: b_fresh
    weight: 1.5
    general: true
    when_spec: {crisper_l: {gte: 25}}
    when_slots: {shopping: {in: [daily]}}
    cites: [shopping]
    say: {hi: "{crisper_l} L ka sabzi ka dabba — roz ki hari sabzi zyada din taaza.", mr: "{crisper_l} L चा भाजीचा डबा — रोजची हिरवी भाजी जास्त दिवस ताजी.", en: "A {crisper_l}-litre vegetable box: daily greens stay fresh longer."}
    card: {hi: "Sabzi zyada din taaza", mr: "भाजी जास्त दिवस ताजी", en: "Greens stay fresh longer"}
  - id: b_power
    weight: 2
    general: true
    when_spec: {stabiliser_free: {eq: true}}
    when_slots: {power_cuts: {in: ["yes"]}}
    cites: [power_cuts]
    say: {hi: "Stabiliser ki zaroorat nahi, aur bijli jaane par {cooling_retention_h} h tak thanda rehta hai.", mr: "स्टॅबिलायझरची गरज नाही, आणि वीज गेल्यावर {cooling_retention_h} h थंड राहतो.", en: "No stabiliser needed, and it stays cold for {cooling_retention_h} hours in a power cut."}
    card: {hi: "Bijli jaane par bhi thanda", mr: "वीज गेली तरी थंड", en: "Cold even in power cuts"}
  - id: b_inverter
    weight: 1
    general: true
    when_spec: {inverter_compressor: {eq: true}}
    when_slots: {family_size: {known: true}}
    cites: [family_size]
    say: {hi: "Inverter compressor — awaaz kam, aur 24 h chalne par bhi bill kam.", mr: "इन्व्हर्टर कंप्रेसर — आवाज कमी, आणि 24 h चालूनही बिल कमी.", en: "Inverter compressor: quieter, and a lower bill though it runs 24 hours."}
    card: {hi: "Kam awaaz, kam bill", mr: "कमी आवाज, कमी बिल", en: "Quiet, lower bill"}
  - id: b_frost
    weight: 0.8
    general: true
    when_spec: {frost_free: {eq: true}}
