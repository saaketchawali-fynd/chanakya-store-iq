quiz:
  - id: wm_q1
    step: translate
    q: {hi: "8 kg ko customer ki zindagi mein kaise samjhayenge?", mr: "8 kg ग्राहकाच्या रोजच्या जगण्यात कसं समजवाल?", en: "How do you explain 8 kg in daily-life terms?"}
    answers:
      - {id: a, title: {hi: "Drum ka size", mr: "ड्रमचा आकार", en: "Drum size"}}
      - {id: b, title: {hi: "2 jeans+2 bedsheet", mr: "2 जीन्स+2 बेडशीट", en: "2 jeans+2 sheets"}}
      - {id: c, title: {hi: "Motor power", mr: "मोटर पॉवर", en: "Motor power"}}
    correct: b
    explain: {hi: "Kapdon mein boliye: '8 kg = ek baar mein 2 jeans aur 2 bedsheet'.", mr: "कपड्यांत सांगा: '8 kg = एका वेळी 2 जीन्स आणि 2 बेडशीट'.", en: "Say it in clothes: '8 kg = 2 jeans and 2 bedsheets in one wash'."}
