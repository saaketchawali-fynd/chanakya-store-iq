myths:
  - id: lp_bigger_processor_always
    short: {hi: "Bada processor hamesha", mr: "मोठा प्रोसेसर नेहमी", en: "Bigger processor always"}
    belief: "A higher processor number is always better for everyone"
    proof: open_software
    keywords: ["i7 hi lena", "sabse bada processor", "i9 chahiye", "highest processor", "सबसे बड़ा प्रोसेसर", "मोठा प्रोसेसर"]
    line: {hi: "सही, बड़ा प्रोसेसर तेज़ होता है। पर कोर्स के सॉफ़्टवेयर के लिए RAM ज़्यादा मायने रखती है — चलाकर देखिए।",
           mr: "बरोबर, मोठा प्रोसेसर वेगवान असतो. पण कोर्सच्या सॉफ्टवेअरसाठी RAM जास्त महत्त्वाची — चालवून बघा.",
           en: "True, a bigger processor is faster. For course software, RAM matters more: try it."}
  - id: lp_storage_speed
    short: {hi: "Zyada storage = tez", mr: "जास्त स्टोरेज = वेगवान", en: "More storage = faster"}
    belief: "More storage makes a laptop faster"
    proof: open_software
    keywords: ["zyada storage tez", "1tb tez", "more storage faster", "ज़्यादा स्टोरेज", "जास्त स्टोरेज"]
    line: {hi: "स्टोरेज ज़रूरी है, सही। पर स्पीड RAM से आती है, स्टोरेज से जगह मिलती है।",
           mr: "स्टोरेज महत्त्वाचं, बरोबर. पण वेग RAM मुळे येतो, स्टोरेजमुळे जागा मिळते.",
           en: "Storage matters, yes. Speed comes from RAM; storage gives you space."}
