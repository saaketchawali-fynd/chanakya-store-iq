quiz:
  - id: lp_q1
    step: translate
    q: {hi: "Student roz college le jaayega. Kaunsa spec batayenge?", mr: "विद्यार्थी रोज कॉलेजला नेणार. कोणता स्पेक सांगाल?", en: "The student carries it to college daily. Which spec do you explain?"}
    answers:
      - {id: a, title: {hi: "Wazan", mr: "वजन", en: "Weight"}}
      - {id: b, title: {hi: "Processor naam", mr: "प्रोसेसरचं नाव", en: "Processor name"}}
      - {id: c, title: {hi: "Speaker", mr: "स्पीकर", en: "Speaker"}}
    correct: a
    explain: {hi: "Wazan aur battery boliye: 'roz bag mein halka, poora din bina charger'.", mr: "वजन आणि बॅटरी सांगा: 'रोज बॅगेत हलका, दिवसभर चार्जरशिवाय'.", en: "Say weight and battery: 'light in the bag, all day without a charger'."}
  - id: lp_q2
    step: assess
    q: {hi: "Laptop mein pehla sawaal kya?", mr: "लॅपटॉपसाठी पहिला प्रश्न कोणता?", en: "What's the first laptop question?"}
    answers:
      - {id: a, title: {hi: "Kaunsa brand", mr: "कोणता ब्रँड", en: "Which brand"}}
      - {id: b, title: {hi: "Course/software", mr: "कोर्स/सॉफ्टवेअर", en: "Course/software"}}
      - {id: c, title: {hi: "Rang", mr: "रंग", en: "Colour"}}
    correct: b
    explain: {hi: "Pehle course aur software poochiye — RAM aur graphics wahi tay karte hain.", mr: "आधी कोर्स आणि सॉफ्टवेअर विचारा — RAM आणि ग्राफिक्स तेच ठरवतात.", en: "Ask course and software first: they decide RAM and graphics."}
  - id: lp_q3
    step: close
    q: {hi: "Parents EMI poochte hain. Kya batayenge?", mr: "पालक EMI विचारतात. काय सांगाल?", en: "Parents ask about EMI. You say…"}
    answers:
      - {id: a, title: {hi: "Sirf mahina", mr: "फक्त महिना", en: "Monthly only"}}
      - {id: b, title: {hi: "Mahina+fees+kul", mr: "महिना+फी+एकूण", en: "Monthly+fee+total"}}
      - {id: c, title: {hi: "Baad mein", mr: "नंतर", en: "Later"}}
    correct: b
    explain: {hi: "EMI ka poora kharcha ek line mein: mahina, fees, kul aur kitna zyada.", mr: "EMI चा पूर्ण खर्च एका ओळीत: महिना, फी, एकूण आणि किती जास्त.", en: "The full EMI cost in one line: monthly, fee, total and the extra."}

