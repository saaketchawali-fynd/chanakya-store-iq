category: laptop
label: {hi: "Laptop", mr: "लॅपटॉप", en: "Laptop"}
required_slots: [user, course, software, carry]
ask_order: [user, course, software, carry]
complete_slots: []
gate_min_slots: 4
cost_slots: []
budget_bands:
  - {id: b1, inr: 45000, title: {hi: "45k tak", mr: "45k पर्यंत", en: "Up to 45k"}}
  - {id: b2, inr: 65000, title: {hi: "45k–80k", mr: "45k–80k", en: "45k–80k"}}
  - {id: b3, inr: 100000, title: {hi: "80k se upar", mr: "80k पेक्षा जास्त", en: "Above 80k"}}
  - {id: none, inr: null, title: {hi: "Nahi bataya", mr: "सांगितलं नाही", en: "Not told"}}
slots:
  - id: user
    phase: life
    title: {hi: "Kaun chalayega", mr: "कोण वापरणार", en: "Who uses it"}
    ask: {hi: "लैपटॉप कौन चलाएगा — पढ़ाई के लिए या काम के लिए?", mr: "लॅपटॉप कोण वापरणार — अभ्यासासाठी की कामासाठी?", en: "Who will use the laptop: for study or for work?"}
    why: {hi: "Padhai ya kaam: wazan, battery aur software badal jaata hai", mr: "अभ्यास की काम: वजन, बॅटरी आणि सॉफ्टवेअर बदलतं", en: "Study or work changes the weight, battery and software it needs"}
    quick:
      - {id: student, title: {hi: "Student", mr: "विद्यार्थी", en: "Student"}}
      - {id: professional, title: {hi: "Kaam ke liye", mr: "कामासाठी", en: "For work"}}
    values: [student, professional]
    value_titles:
      student: {hi: "Student", mr: "विद्यार्थी", en: "Student"}
      professional: {hi: "Kaam ke liye", mr: "कामासाठी", en: "Professional"}
    priors: {student: 0.6, professional: 0.4}
    keywords:
      student: ["student", "padhai", "college", "beta ke liye", "beti ke liye", "पढ़ाई", "कॉलेज", "अभ्यास", "विद्यार्थी"]
      professional: ["office", "kaam ke liye", "job", "work from home", "ऑफिस", "काम के लिए", "कामासाठी"]
  - id: course
    phase: life
    title: {hi: "Course/kaam", mr: "कोर्स/काम", en: "Course/work"}
    ask: {hi: "कौन-सा कोर्स या काम है — इंजीनियरिंग, कॉमर्स, डिज़ाइन?", mr: "कोणता कोर्स किंवा काम — इंजिनिअरिंग, कॉमर्स, डिझाइन?", en: "Which course or work: engineering, commerce, design?"}
    why: {hi: "Engineering/design ko zyada RAM aur graphics; commerce basic par chal jaata hai", mr: "इंजिनिअरिंग/डिझाइनला जास्त RAM आणि ग्राफिक्स; कॉमर्स साध्यावर चालतं", en: "Engineering and design need more RAM and graphics; commerce runs on a basic one"}
    quick:
      - {id: engineering, title: {hi: "Engineering", mr: "इंजिनिअरिंग", en: "Engineering"}}
      - {id: commerce, title: {hi: "Commerce", mr: "कॉमर्स", en: "Commerce"}}
      - {id: design, title: {hi: "Design", mr: "डिझाइन", en: "Design"}}
    values: [engineering, commerce, design, school, other]
    value_titles:
      engineering: {hi: "Engineering", mr: "इंजिनिअरिंग", en: "Engineering"}
      commerce: {hi: "Commerce", mr: "कॉमर्स", en: "Commerce"}
      design: {hi: "Design", mr: "डिझाइन", en: "Design"}
      school: {hi: "School", mr: "शाळा", en: "School"}
      other: {hi: "Aur kuch", mr: "इतर", en: "Other"}
    priors: {engineering: 0.4, commerce: 0.35, design: 0.25}
    keywords:
      engineering: ["engineering", "btech", "b.tech", "computer science", "इंजीनियरिंग", "इंजिनिअरिंग"]
      commerce: ["commerce", "bcom", "b.com", "ca ", "mba", "कॉमर्स"]
      design: ["design", "architecture", "animation", "डिज़ाइन", "डिझाइन"]
      school: ["school", "10th", "12th", "स्कूल", "शाळा"]
      other: ["arts", "kuch aur", "other course", "आर्ट्स", "इतर"]
  - id: software
    multi: true
    phase: life
    title: {hi: "Software", mr: "सॉफ्टवेअर", en: "Software"}
    ask: {hi: "कौन-से सॉफ़्टवेयर चलेंगे — ऑफ़िस, कोडिंग, डिज़ाइन या वीडियो एडिटिंग?", mr: "कोणते सॉफ्टवेअर चालणार — ऑफिस, कोडिंग, डिझाइन की व्हिडिओ एडिटिंग?", en: "Which software: office, coding, design or video editing?"}
    why: {hi: "Bhaari software ko zyada RAM chahiye", mr: "जड सॉफ्टवेअरला जास्त RAM हवी", en: "Heavy software needs more RAM"}
    quick:
      - {id: office, title: {hi: "Office/browser", mr: "ऑफिस/ब्राउझर", en: "Office/browser"}}
      - {id: coding, title: {hi: "Coding", mr: "कोडिंग", en: "Coding"}}
      - {id: cad, title: {hi: "CAD/design", mr: "CAD/डिझाइन", en: "CAD/design"}}
    values: [office, coding, cad, editing]
    value_titles:
      office: {hi: "Office/browser", mr: "ऑफिस/ब्राउझर", en: "Office/browser"}
      coding: {hi: "Coding", mr: "कोडिंग", en: "Coding"}
      cad: {hi: "CAD/design", mr: "CAD/डिझाइन", en: "CAD/design"}
      editing: {hi: "Video editing", mr: "व्हिडिओ एडिटिंग", en: "Video editing"}
    priors: {office: 0.45, coding: 0.3, cad: 0.25}
    keywords:
      office: ["excel", "word", "powerpoint", "browser", "online class", "एक्सेल", "ऑफ़िस", "ऑफिस"]
      coding: ["coding", "programming", "python", "java", "कोडिंग", "प्रोग्रामिंग"]
      cad: ["autocad", "solidworks", "cad", "photoshop", "ऑटोकैड", "ऑटोकॅड"]
      editing: ["video editing", "premiere", "editing", "youtube video", "वीडियो एडिटिंग", "व्हिडिओ एडिटिंग"]
  - id: carry
    phase: life
    title: {hi: "Roz le jaana", mr: "रोज नेणं", en: "Carried daily"}
    ask: {hi: "लैपटॉप रोज़ बैग में साथ ले जाएँगे?", mr: "लॅपटॉप रोज बॅगेत सोबत नेणार का?", en: "Will the laptop be carried in a bag every day?"}
    why: {hi: "Roz le jaana ho to halka laptop", mr: "रोज नेणार असाल तर हलका लॅपटॉप", en: "Daily carry needs a light laptop"}
    quick:
      - {id: daily, title: {hi: "Haan, roz", mr: "हो, रोज", en: "Yes, daily"}}
      - {id: rarely, title: {hi: "Kabhi kabhi", mr: "कधी कधी", en: "Rarely"}}
    values: [daily, rarely]
    value_titles:
      daily: {hi: "Roz le jaana", mr: "रोज नेणार", en: "Carried daily"}
      rarely: {hi: "Kabhi kabhi", mr: "कधी कधी", en: "Rarely"}
    priors: {daily: 0.6, rarely: 0.4}
    keywords:
      daily: ["roz le jaana", "roz college", "daily carry", "bag mein", "रोज़ ले जाना", "रोज नेणार"]
      rarely: ["ghar pe hi", "desk pe", "rarely carry", "घर पर ही", "घरीच"]
  - id: battery_need
    phase: life
    title: {hi: "Poore din battery", mr: "दिवसभर बॅटरी", en: "All-day battery"}
    ask: {hi: "पूरे दिन बिना चार्जर के चलना चाहिए?", mr: "दिवसभर चार्जरशिवाय चालायला हवा का?", en: "Should it last the whole day without a charger?"}
    why: {hi: "Poore din ke liye zyada battery hours", mr: "दिवसभरासाठी जास्त बॅटरी hours", en: "All-day use needs more battery hours"}
    quick:
      - {id: "yes", title: {hi: "Haan", mr: "हो", en: "Yes"}}
      - {id: "no", title: {hi: "Nahi", mr: "नाही", en: "No"}}
    values: ["yes", "no"]
    value_titles:
      "yes": {hi: "Poore din chahiye", mr: "दिवसभर हवी", en: "All day needed"}
      "no": {hi: "Charger paas", mr: "चार्जर जवळ", en: "Charger nearby"}
    priors: {"yes": 0.55, "no": 0.45}
    keywords:
      "yes": ["poore din battery", "battery zyada", "bina charger", "all day battery", "पूरे दिन", "दिवसभर बॅटरी"]
      "no": ["charger paas", "plug mein", "battery zaroori nahi", "चार्जर पास", "चार्जर जवळ"]
  - id: gaming
    phase: life
    title: {hi: "Gaming", mr: "गेमिंग", en: "Gaming"}
    ask: {hi: "गेम भी खेलेंगे?", mr: "गेम्सही खेळणार का?", en: "Will it be used for gaming too?"}
    why: {hi: "Gaming ke liye alag graphics card", mr: "गेमिंगसाठी वेगळं ग्राफिक्स कार्ड", en: "Gaming needs a dedicated graphics card"}
    quick:
      - {id: "yes", title: {hi: "Haan", mr: "हो", en: "Yes"}}
      - {id: "no", title: {hi: "Nahi", mr: "नाही", en: "No"}}
    values: ["yes", "no"]
    value_titles:
      "yes": {hi: "Gaming bhi", mr: "गेमिंगही", en: "Gaming too"}
      "no": {hi: "Gaming nahi", mr: "गेमिंग नाही", en: "No gaming"}
    priors: {"yes": 0.3, "no": 0.7}
    keywords:
      "yes": ["gaming", "game khelega", "valorant", "gta", "गेमिंग", "गेम खेल"]
      "no": ["gaming nahi", "no games", "game nahi", "गेम नहीं", "गेम नाही"]
  - id: decider
    phase: life
    title: {hi: "Faisla kaun", mr: "निर्णय कोण", en: "Decider"}
    ask: {hi: "फ़ैसला आप ही लेंगे या घर पर किसी से पूछना है?", mr: "निर्णय तुम्हीच घेणार की घरी कोणाला विचारायचं आहे?", en: "Will you decide, or do you need to ask someone at home?"}
    why: {hi: "Jo decide karega, use Parivaar Card bhejenge", mr: "जो निर्णय घेईल त्याला परिवार कार्ड पाठवू", en: "We'll send the family card to the decider"}
    quick:
      - {id: self, title: {hi: "Khud", mr: "स्वतः", en: "Myself"}}
      - {id: family, title: {hi: "Ghar pe poochna", mr: "घरी विचारायचं", en: "Ask family"}}
      - {id: together, title: {hi: "Saath mein", mr: "सगळे मिळून", en: "Together"}}
    values: [self, family, together]
    value_titles:
      self: {hi: "Khud", mr: "स्वतः", en: "Themselves"}
      family: {hi: "Ghar pe poochna", mr: "घरी विचारायचं", en: "Ask family"}
      together: {hi: "Saath mein", mr: "सगळे मिळून", en: "Together"}
    priors: {self: 0.4, family: 0.4, together: 0.2}
    keywords:
      self: ["khud decide", "khud lenge", "decide myself", "खुद", "स्वतः ठरवणार"]
      family: ["ghar pe poochna", "ghar par poochenge", "husband se", "wife se", "ask family", "घर पर पूछ", "घरी विचार"]
      together: ["saath mein decide", "milke", "together", "मिलकर", "सगळे मिळून"]
  - id: payer
    phase: tech
    title: {hi: "Kaun le raha", mr: "कोण घेतंय", en: "Who is buying"}
    ask: {hi: "लैपटॉप आप खुद ले रहे हैं या घरवाले दिला रहे हैं?", mr: "लॅपटॉप तुम्ही स्वतः घेताय की घरचे घेऊन देतायत?", en: "Are you buying it yourself, or is the family buying it?"}
    why: {hi: "Jo pay karega, Parivaar Card usse bhi", mr: "जो पैसे भरेल त्यालाही परिवार कार्ड", en: "The payer should also get the family card"}
    quick:
      - {id: self, title: {hi: "Khud", mr: "स्वतः", en: "Myself"}}
      - {id: parents, title: {hi: "Mummy-papa", mr: "आई-बाबा", en: "Parents"}}
    values: [self, parents]
    value_titles:
      self: {hi: "Khud", mr: "स्वतः", en: "Self"}
      parents: {hi: "Mummy-papa", mr: "आई-बाबा", en: "Parents"}
    priors: {self: 0.4, parents: 0.6}
    keywords:
      self: ["khud le raha", "apne paise", "buying myself", "खुद ले रहा", "स्वतः घेतोय"]
      parents: ["papa dila rahe", "parents", "ghar wale", "मम्मी पापा", "आई-बाबा", "घरचे"]

fit_rules:
  - id: perf_ok
    weight: 3
    slot: software
    when: {has_any: [cad, editing]}
    tiers:
      - {spec_all: [{ram_gb: {gte: 16}}, {gpu: {eq: dedicated}}], score: 1.0}
      - {spec_all: [{ram_gb: {gte: 16}}], score: 0.7}
    else: 0.3
  - id: coding_ok
    weight: 2
    slot: software
    when: {has_any: [coding]}
    tiers:
      - {spec_all: [{ram_gb: {gte: 16}}], score: 1.0}
    else: 0.6
  - {id: carry_ok, weight: 2, slot: carry, when: {in: [daily]}, spec_any: [{weight_kg: {lte: 1.6}}], else: 0.3}
  - {id: battery_ok, weight: 2, slot: battery_need, when: {in: ["yes"]}, spec_any: [{battery_h: {gte: 10}}], else: 0.3}
  - {id: gaming_ok, weight: 2, slot: gaming, when: {in: ["yes"]}, spec_any: [{gpu: {eq: dedicated}}], else: 0.2}
reasons:
  perf_ok: {hi: "Design software aaram se", mr: "डिझाइन सॉफ्टवेअर आरामात", en: "Runs design software easily"}
  coding_ok: {hi: "Coding mein atkega nahi", mr: "कोडिंगमध्ये अडकणार नाही", en: "Smooth for coding"}
  carry_ok: {hi: "Roz bag mein halka", mr: "रोज बॅगेत हलका", en: "Light in the bag daily"}
  battery_ok: {hi: "Poora din bina charger", mr: "दिवसभर चार्जरशिवाय", en: "All day without a charger"}
  gaming_ok: {hi: "Gaming ke liye graphics", mr: "गेमिंगसाठी ग्राफिक्स", en: "Graphics for gaming"}
  value_fit: {hi: "Kaam ke liye kaafi, kam kharcha", mr: "कामासाठी पुरेसा, कमी खर्च", en: "Enough for the work, costs less"}
  step_up: {hi: "Zyada power, 4 saal aage ka", mr: "जास्त पॉवर, 4 वर्षांचा विचार", en: "More power, built for 4 years"}

benefits:
  - id: b_ram
    weight: 3
    when_spec: {ram_gb: {gte: 16}}
    when_slots: {software: {known: true}}
    cites: [software]
    say: {hi: "{ram_gb} GB मतलब कॉलेज का सॉफ़्टवेयर और 20 टैब साथ में, अटकेगा नहीं।", mr: "{ram_gb} GB म्हणजे कॉलेजचं सॉफ्टवेअर आणि 20 टॅब एकत्र, अडकणार नाही.", en: "{ram_gb} GB: college software and 20 tabs together, no lag."}
    card: {hi: "सॉफ़्टवेयर + 20 टैब, बिना अटके", mr: "सॉफ्टवेअर + 20 टॅब, न अडकता", en: "Software + 20 tabs, no lag"}
  - id: b_weight
    weight: 2
    when_spec: {weight_kg: {lte: 1.6}}
    when_slots: {carry: {in: [daily]}}
    cites: [carry]
    say: {hi: "{weight_kg} kg — रोज़ बैग में हल्का।", mr: "{weight_kg} kg — रोज बॅगेत हलका.", en: "{weight_kg} kg: light in the bag every day."}
    card: {hi: "रोज़ बैग में हल्का", mr: "रोज बॅगेत हलका", en: "Light for daily carry"}
  - id: b_battery
    weight: 2
    when_spec: {battery_h: {gte: 10}}
    when_slots: {battery_need: {in: ["yes"]}}
    cites: [battery_need]
    say: {hi: "{battery_h} h — पूरा कॉलेज दिन बिना चार्जर।", mr: "{battery_h} h — पूर्ण कॉलेज दिवस चार्जरशिवाय.", en: "{battery_h} hours: a full college day without a charger."}
    card: {hi: "पूरा दिन बिना चार्जर", mr: "दिवसभर चार्जरशिवाय", en: "All day, no charger"}
  - id: b_gpu_design
    weight: 2
    when_spec: {gpu: {eq: dedicated}}
    when_slots: {software: {has_any: [cad, editing]}}
    cites: [software]
    say: {hi: "अलग ग्राफ़िक्स कार्ड — डिज़ाइन और वीडियो जल्दी बनेंगे।", mr: "वेगळं ग्राफिक्स कार्ड — डिझाइन आणि व्हिडिओ लवकर होतील.", en: "Dedicated graphics: design and video work renders faster."}
    card: {hi: "डिज़ाइन-वीडियो तेज़", mr: "डिझाइन-व्हिडिओ वेगवान", en: "Faster design and video"}
  - id: b_gpu_game
    weight: 2
    when_spec: {gpu: {eq: dedicated}}
    when_slots: {gaming: {in: ["yes"]}}
    cites: [gaming]
    say: {hi: "अलग ग्राफ़िक्स कार्ड — गेम स्मूथ चलेंगे।", mr: "वेगळं ग्राफिक्स कार्ड — गेम्स स्मूथ चालतील.", en: "Dedicated graphics: games run smooth."}
    card: {hi: "गेम स्मूथ", mr: "गेम्स स्मूथ", en: "Smooth gaming"}
  - id: b_storage
    weight: 1
    when_spec: {storage_gb: {gte: 1024}}
    when_slots: {software: {has_any: [editing, cad]}}
    cites: [software]
    say: {hi: "{storage_gb} GB स्टोरेज — बड़े प्रोजेक्ट आराम से रखिए।", mr: "{storage_gb} GB स्टोरेज — मोठे प्रोजेक्ट आरामात ठेवा.", en: "{storage_gb} GB storage: room for big projects."}
    card: {hi: "बड़े प्रोजेक्ट के लिए जगह", mr: "मोठ्या प्रोजेक्टसाठी जागा", en: "Room for big projects"}

demos:
  - id: weight_hold
    title: {hi: "Wazan demo", mr: "वजन डेमो", en: "Weight demo"}
    when_slots: {carry: {in: [daily]}}
    differs_on: weight_kg
    steps: {hi: "Customer ke haath mein {best} aur {other} baari baari dijiye", mr: "ग्राहकाच्या हातात {best} आणि {other} आळीपाळीने द्या", en: "Hand {best} and {other} to the customer one by one"}
    say: {hi: "हाथ में लेकर देखिए — {best} रोज़ ले जाने में हल्का है।", mr: "हातात घेऊन बघा — {best} रोज नेण्यासाठी हलका आहे.", en: "Hold them: {best} is lighter to carry every day."}
  - id: open_software
    title: {hi: "Software demo", mr: "सॉफ्टवेअर डेमो", en: "Software demo"}
    when_slots: {software: {known: true}}
