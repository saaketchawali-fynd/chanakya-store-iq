    step: complete
    q: {hi: "AC ka poora kharcha kab batayenge?", mr: "AC चा पूर्ण खर्च केव्हा सांगाल?", en: "When do you give the AC's full cost?"}
    answers:
      - {id: a, title: {hi: "Bill ke time", mr: "बिलाच्या वेळी", en: "At billing"}}
      - {id: b, title: {hi: "Site sawaal ke baad", mr: "साइट प्रश्नांनंतर", en: "After site questions"}}
      - {id: c, title: {hi: "Kabhi nahi", mr: "कधीच नाही", en: "Never"}}
    correct: b
    explain: {hi: "Pipe, bracket, chhed poochh kar poora kharcha card par dikhaiye.", mr: "पाइप, ब्रॅकेट, होल विचारून पूर्ण खर्च कार्डवर दाखवा.", en: "Ask pipe, bracket and hole, then show the full cost on the card."}
