    step: translate
    q: {hi: "Customer roz 10 h AC chalayenge. Kya batayenge?", mr: "ग्राहक रोज 10 h AC चालवणार. काय सांगाल?", en: "The customer runs the AC 10 hours a day. What do you explain?"}
    answers:
      - {id: a, title: {hi: "Wifi", mr: "WiFi", en: "WiFi"}}
      - {id: b, title: {hi: "Mahine ka bill", mr: "महिन्याचं बिल", en: "Monthly bill"}}
      - {id: c, title: {hi: "Rang", mr: "रंग", en: "Colour"}}
    correct: b
    explain: {hi: "Label se mahine ka bill boliye — lambe hours mein star rating hi faayda hai.", mr: "लेबलवरून महिन्याचं बिल सांगा — जास्त hours मध्ये star ratingच फायदा.", en: "Say the monthly bill from the label: for long hours the star rating pays."}
