      - {id: c, title: {hi: "Remote", mr: "रिमोट", en: "Remote"}}
    correct: a
    explain: {hi: "Kamra aur top floor poochiye — ton wahi tay karta hai.", mr: "खोली आणि वरचा मजला विचारा — ton तेच ठरवतं.", en: "Ask room size and top floor: that decides the tonnage."}
