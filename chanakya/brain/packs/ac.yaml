    step: assess
    q: {hi: "AC ka ton kis sawaal se tay hota hai?", mr: "AC चा ton कोणत्या प्रश्नावरून ठरतो?", en: "Which question decides the AC tonnage?"}
    answers:
      - {id: a, title: {hi: "Kamre ka size", mr: "खोलीचा आकार", en: "Room size"}}
