    card: {hi: "Roz chalaiye, bill kam", mr: "रोज चालवा, बिल कमी", en: "Daily use, lower bill"}
  - id: b_saving
    weight: 2
    when_spec: {star: {gte: 5}}
    when_slots: {hours_per_day: {known: true}}
    cites: [hours_per_day]
    say: {hi: "3-star se 5 saal mein lagbhag {five_year_saving} ki bijli bachat.", mr: "3-star पेक्षा 5 वर्षांत साधारण {five_year_saving} वीज बचत.", en: "About {five_year_saving} saved on electricity over 5 years versus 3-star."}
    card: {hi: "5 saal mein bijli bachat", mr: "5 वर्षांत वीज बचत", en: "Electricity savings in 5 years"}
  - id: b_sun
    weight: 1.5
    when_spec: {ton: {in_band: true}}
    when_slots: {sun_exposure: {in: ["yes"]}}
