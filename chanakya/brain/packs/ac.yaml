    say: {hi: "{ton} ton matlab aapke {sqft} sq ft kamre ke liye sahi thandak.", mr: "{ton} ton म्हणजे तुमच्या {sqft} sq ft खोलीसाठी योग्य थंडावा.", en: "{ton} ton means the right cooling for your {sqft} sq ft room."}
