myths:
  - id: tv_4k_useless
    belief: "4K is useless because TV channels are only HD"
    proof: own_content
    keywords: ["4k bekaar", "4k bekar", "4k ka fayda nahi", "4k useless", "channel hd", "4k की ज़रूरत नहीं", "4k बेकार", "4k चा उपयोग नाही"]
    line: {hi: "सही कहा, ज़्यादातर चैनल HD हैं। पर Netflix, YouTube 4K में आते हैं, और ये टीवी HD को भी साफ़ दिखाता है।",
           mr: "बरोबर, बहुतेक चॅनेल HD आहेत. पण Netflix, YouTube 4K मध्ये येतात, आणि हा टीव्ही HD सुद्धा स्पष्ट दाखवतो.",
           en: "True, most channels are HD. But Netflix and YouTube stream in 4K, and this TV makes HD look sharper too."}
  - id: tv_big_screen_eyes
    belief: "A big TV screen is bad for the eyes"
    proof: distance_demo
    keywords: ["aankh kharab", "aankhon ko nuksan", "bad for eyes", "eyes hurt", "आँख खराब", "आंखों को नुकसान", "डोळे खराब"]
    line: {hi: "सही सोचा, बहुत पास बड़ा टीवी थकाता है। आपकी दूरी के हिसाब से सही साइज़ हो तो आँखों पर ज़ोर नहीं पड़ता।",
           mr: "बरोबर विचार केला, खूप जवळून मोठा टीव्ही थकवतो. तुमच्या अंतरानुसार योग्य साइज असेल तर डोळ्यांवर ताण येत नाही.",
           en: "Fair point: a big screen too close is tiring. Matched to your distance, the right size is easy on the eyes."}
  - id: tv_watts
    belief: "More speaker watts means better sound"
    proof: dialogue_low_volume
    keywords: ["zyada watt", "jyada watt", "more watts", "watt zyada", "ज़्यादा वॉट", "जास्त वॉट"]
    line: {hi: "सही, वॉट से आवाज़ तेज़ होती है। पर साफ़ डायलॉग के लिए साउंड मोड ज़्यादा ज़रूरी है — सुनकर देखिए।",
           mr: "बरोबर, वॉटने आवाज मोठा होतो. पण स्पष्ट संवादासाठी साउंड मोड जास्त महत्त्वाचा — ऐकून बघा.",
           en: "True, watts make it louder. For clear dialogue the sound mode matters more: have a listen."}
site_needs: [wall_type, socket_near, floor_lift]
quiz:
  - id: tv_q1
    step: translate
    q: {hi: "Customer ka kamra dhoop wala hai. Kaunsa feature batayenge?", mr: "ग्राहकाची खोली उन्हाची आहे. कोणतं फीचर सांगाल?", en: "The customer's room is sunny. Which feature do you explain?"}
    answers:
      - {id: a, title: {hi: "Brightness", mr: "ब्राइटनेस", en: "Brightness"}}
      - {id: b, title: {hi: "Speaker watt", mr: "स्पीकर वॉट", en: "Speaker watts"}}
      - {id: c, title: {hi: "HDMI ports", mr: "HDMI पोर्ट", en: "HDMI ports"}}
    correct: a
    explain: {hi: "Dhoop mein bright screen hi saaf dikhti hai — 'dhoop mein bhi saaf' boliye.", mr: "उन्हात ब्राइट स्क्रीनच स्पष्ट दिसते — 'उन्हातही स्पष्ट' सांगा.", en: "In sun only a bright screen stays clear: say 'clear even in sun'."}
  - id: tv_q2
    step: close
    q: {hi: "Customer pehle hi daam pooch le to?", mr: "ग्राहकाने आधीच किंमत विचारली तर?", en: "The customer asks the price first. You…"}
    answers:
      - {id: a, title: {hi: "Seedha daam bolo", mr: "थेट किंमत सांगा", en: "Say the price"}}
      - {id: b, title: {hi: "Range + 2 sawaal", mr: "रेंज + 2 प्रश्न", en: "Range + 2 questions"}}
      - {id: c, title: {hi: "Offer batao", mr: "ऑफर सांगा", en: "Mention the offer"}}
    correct: b
    explain: {hi: "Imaandari se range boliye, phir kamre ke 2 sawaal — sahi TV milega.", mr: "प्रामाणिकपणे रेंज सांगा, मग खोलीचे 2 प्रश्न — योग्य टीव्ही मिळेल.", en: "Give an honest range, then 2 room questions: you'll find the right TV."}
  - id: tv_q3
    step: assess
    q: {hi: "TV ka sahi size kis sawaal se tay hota hai?", mr: "टीव्हीची योग्य साइज कोणत्या प्रश्नावरून ठरते?", en: "Which question decides the right TV size?"}
    answers:
      - {id: a, title: {hi: "Budget kitna", mr: "बजेट किती", en: "What budget"}}
      - {id: b, title: {hi: "Sofa se doori", mr: "सोफ्यापासून अंतर", en: "Sofa distance"}}
      - {id: c, title: {hi: "Kaunsa brand", mr: "कोणता ब्रँड", en: "Which brand"}}
    correct: b
    explain: {hi: "Pehle poochiye: 'Sofa se TV kitne kadam door hoga?' — size wahi tay karta hai.", mr: "आधी विचारा: 'सोफ्यापासून टीव्ही किती पावलं लांब?' — साइज तेच ठरवतं.", en: "Ask first: 'How many steps from the sofa to the TV?' That decides the size."}
