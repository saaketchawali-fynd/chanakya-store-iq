    steps: {hi: "Customer ko {steps} kadam door khada kariye; dono size saamne", mr: "ग्राहकाला {steps} पावलं लांब उभं करा; दोन्ही साइज समोर", en: "Stand the customer {steps} steps away; both sizes in front"}
    say: {hi: "अपने सोफ़े जितनी दूरी से दोनों देखिए — कौन-सा आराम से दिखता है?", mr: "तुमच्या सोफ्याइतक्या अंतरावरून दोन्ही पाहा — कोणता आरामात दिसतो?", en: "Look from your sofa distance: which one feels comfortable?"}
